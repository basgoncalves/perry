<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>if(window.top!==window.self){try{window.top.location.replace(location.href)}catch(e){}}</script>
<title>BGB Bookings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f7f4;--card:#fff;--fg:#17221c;--muted:#5b6a61;--line:#d9e2db;--accent:#2f7a55;--accent2:#e3f0e8;--warm:#c0663e;--bad:#b23a3a}
@media (prefers-color-scheme:dark){:root{--bg:#111714;--card:#19211d;--fg:#e4ece6;--muted:#95a59b;--line:#2a3630;--accent:#5fbf8c;--accent2:#1f3329;--warm:#e08b62;--bad:#ec7a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Work Sans",system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 48px}
h1{font:600 1.6rem "Fraunces",Georgia,serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top a{color:var(--muted);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
form{display:grid;gap:10px;max-width:360px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:600 .9rem inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:5px 12px;font-size:.8rem}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.msg{font-size:.85rem;color:var(--muted);min-height:1.2em}
.list{display:grid;gap:10px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.bk .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bk .when{font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:999px;font-weight:600}
.pending{background:#f6e3c9;color:#8a4a12}.confirmed{background:var(--accent2);color:var(--accent)}.cancelled{background:var(--line);color:var(--muted)}
.bk .who{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.bk .goal{font-size:.88rem;border-left:3px solid var(--line);padding-left:8px}
.empty{color:var(--muted);text-align:center;padding:30px}
</style></head><body>
<div class="w">
<div class="top"><h1>BGB Bookings</h1><a href="../">← Back to Perry</a></div>

<div id="login" class="card" hidden>
 <form id="lf">
  <p class="msg" style="margin:0">Sign in with an approved BGB Health admin account.</p>
  <button type="button" class="btn" id="gg" style="background:var(--card);color:var(--fg);border:1.5px solid var(--line)">Continue with Google</button>
  <p class="msg" style="margin:0;text-align:center">or use email</p>
  <label for="le">Email<input id="le" type="email" required autocomplete="email"></label>
  <label for="lp">Password<input id="lp" type="password" required minlength="8" autocomplete="current-password"></label>
  <div class="bar"><button class="btn">Sign in</button><button type="button" class="btn ghost" id="su">Create account</button></div>
  <p class="msg" id="lm" role="status"></p>
 </form>
</div>

<div id="app" hidden>
 <div class="bar">
  <select id="flt" aria-label="Show"><option value="up">Upcoming</option><option value="all">All</option><option value="cancelled">Cancelled</option></select>
  <button class="btn small ghost" id="rf">Refresh</button>
  <button class="btn small" id="nt">Turn on notifications</button>
  <button class="btn small ghost" id="lo">Sign out</button>
 </div>
 <p class="msg" id="am" role="status"></p>
 <div class="list" id="list"></div>
</div>
</div>
<script>
const SB="https://gfzqvaumziuiwfrwhhes.supabase.co",KEY="sb_publishable_NxmiKUulD7hNH6CkUsEwIA_ki8EDWyC";
const VAPID="BCt0Yr_RlL0CW0UgD30q2Z3llFrZumUyMfGBOK-zO7-F2zAkp1EN2L-Q-fqoXmvXG6TYo0h4eiDdnXzvhyLSi24";
const NAMES={init:"Initial assessment",train:"Training consultation",nutri:"Nutrition consultation",gait:"Running video analysis",coach:"Coaching package",chk:"Follow-up call"};
const db=supabase.createClient(SB,KEY);const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t).toLocaleString("en-GB",{timeZone:"Europe/Vienna",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

async function boot(){const {data:{session}}=await db.auth.getSession();$("login").hidden=!!session;$("app").hidden=!session;if(session){load();notifState()}}
db.auth.onAuthStateChange(()=>boot());

$("lf").onsubmit=async e=>{e.preventDefault();$("lm").textContent="Signing in…";
 const {error}=await db.auth.signInWithPassword({email:$("le").value,password:$("lp").value});
 $("lm").textContent=error?(/confirm/i.test(error.message)?"Confirm your email first: open the link Supabase sent you, then sign in.":"Wrong email or password."):""};
$("su").onclick=async()=>{if(!$("lf").reportValidity())return;$("lm").textContent="Creating account…";
 const {error}=await db.auth.signUp({email:$("le").value,password:$("lp").value,options:{emailRedirectTo:location.href}});
 $("lm").textContent=error?error.message:"Check your inbox and open the confirmation link. If it opens a page that doesn't load, that's fine: your account is confirmed. Come back here and sign in."};
$("gg").onclick=async()=>{$("lm").textContent="Opening Google…";
 const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
 if(error)$("lm").textContent=/not enabled|provider/i.test(error.message)?"Google sign-in isn't switched on in Supabase yet.":error.message};
$("lo").onclick=()=>db.auth.signOut();
$("rf").onclick=load;$("flt").onchange=load;

async function load(){$("am").textContent="Loading…";
 let q=db.from("bookings").select("*").order("start_at",{ascending:true});
 const f=$("flt").value;if(f==="up")q=q.gte("start_at",new Date(Date.now()-3600e3).toISOString()).neq("status","cancelled");if(f==="cancelled")q=q.eq("status","cancelled");
 const {data,error}=await q;
 if(error){$("am").textContent="Couldn't load bookings: "+error.message;return}
 $("am").textContent=data.length?`${data.length} booking${data.length>1?"s":""}`:"";
 if(!data.length){const {data:ok}=await db.rpc("is_bgb_admin");
  $("list").innerHTML=`<div class="empty">${ok?"No bookings here yet. New ones appear as soon as a client books.":"This account isn't on the BGB Health admin list, so bookings stay hidden."}</div>`;return}
 $("list").innerHTML=data.map(b=>`<div class="bk"><div class="h"><span class="when">${fmt(b.start_at)}</span><span class="pill ${b.status}">${b.status}</span></div>
  <div><b>${esc(NAMES[b.service_id]||b.service_id)}</b> · ${b.duration_min} min</div>
  <div class="who">${esc(b.name)} · <span style="user-select:all">${esc(b.email)}</span></div>
  ${b.goal?`<div class="goal">${esc(b.goal)}</div>`:""}
  <div class="bar" style="margin:4px 0 0">${b.status!=="confirmed"&&b.status!=="cancelled"?`<button class="btn small" data-id="${b.id}" data-s="confirmed">Confirm</button>`:""}${b.status!=="cancelled"?`<button class="btn small bad" data-id="${b.id}" data-s="cancelled">Cancel</button>`:`<button class="btn small ghost" data-id="${b.id}" data-s="pending">Restore</button>`}</div></div>`).join("")}
$("list").onclick=async e=>{const b=e.target.closest("[data-s]");if(!b)return;b.disabled=true;
 const {error}=await db.from("bookings").update({status:b.dataset.s}).eq("id",b.dataset.id);
 $("am").textContent=error?"Couldn't update: "+error.message:"Updated.";load()};

function b64(s){const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function notifState(){if(!("serviceWorker"in navigator)||!("PushManager"in window)){$("nt").hidden=true;return}
 const reg=await navigator.serviceWorker.getRegistration("../");const sub=reg&&await reg.pushManager.getSubscription();
 $("nt").textContent=sub?"Notifications on":"Turn on notifications";$("nt").className=sub?"btn small ghost":"btn small"}
$("nt").onclick=async()=>{try{
 const perm=await Notification.requestPermission();if(perm!=="granted"){$("am").textContent="Notifications are blocked. Allow them for this site in your browser settings.";return}
 const reg=await navigator.serviceWorker.register("../sw.js",{scope:"../"});await navigator.serviceWorker.ready;
 const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
 const j=sub.toJSON();const {error}=await db.from("push_subs").upsert({endpoint:j.endpoint,sub:j});
 $("am").textContent=error?"Couldn't save this device: "+error.message:"This device will now get a notification for every new booking.";notifState()}
 catch(e){$("am").textContent="Couldn't turn on notifications here. Open this page on its own (not inside Perry's tab) and try again."}};
setInterval(()=>{if(!$("app").hidden&&!document.hidden)load()},60000);
boot();
</script>
</body></html>
