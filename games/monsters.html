<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Wildlings — demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 30% 20%,#2c2f4a,#12131c);color:#1d2233;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
#gba{width:min(100vw,480px);background:linear-gradient(160deg,#7b6cf0,#4b3fb0);border-radius:28px;padding:14px;box-shadow:0 20px 50px #0009,inset 0 1px 0 #fff4}
#screen{border-radius:16px;aspect-ratio:3/2;position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px #0003,0 4px 14px #0005;background:#000}
canvas{width:100%;height:100%;display:block}
#box{position:absolute;left:8px;right:8px;bottom:8px;min-height:28%;background:#ffffffe8;backdrop-filter:blur(6px);border-radius:14px;padding:9px 12px;font-size:clamp(12px,3.5vw,15px);line-height:1.4;box-shadow:0 6px 18px #0004;animation:pop .18s ease-out}
#box.hide{display:none}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
#menu button{font:inherit;font-weight:600;background:#eef0ff;border:0;border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;color:#2b2f5c;transition:.12s}
#menu button:hover,#menu button:focus{background:#5b4fd8;color:#fff;outline:none;transform:translateY(-1px)}
#menu button:disabled{opacity:.4}
#menu button .t{font-size:.75em;opacity:.7;font-weight:500}
input{font:inherit;padding:6px 10px;border:2px solid #c9cdf5;border-radius:10px;width:100%;outline:none;margin-top:4px}
input:focus{border-color:#5b4fd8}
#dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center;margin-top:12px;visibility:hidden}
#dpad button{font-size:17px;background:#ffffff22;color:#fff;border:0;border-radius:14px;touch-action:manipulation;box-shadow:inset 0 1px 0 #fff3,0 2px 6px #0003}
#dpad button:active{background:#ffffff44;transform:scale(.95)}
#dpad [data-d=u]{grid-area:1/2}#dpad [data-d=l]{grid-area:2/1}#dpad [data-d=r]{grid-area:2/3}#dpad [data-d=d]{grid-area:3/2}
#dpad #mbtn{grid-area:2/2;font-size:11px;font-weight:700;letter-spacing:1px;background:#ffd166;color:#4b3fb0}
.label{color:#ffffffb0;text-align:center;font-weight:700;margin-top:10px;letter-spacing:3px;font-size:11px}
#panel{position:absolute;inset:0;background:linear-gradient(160deg,#f6f7ff,#e3e6ff);padding:10px;overflow:auto;display:none;font-size:13px}
#panel.on{display:block;animation:pop .18s ease-out}
#panel h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;color:#2b2f5c}
#panel .x{border:0;background:#5b4fd8;color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;cursor:pointer}
.card{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px;margin-bottom:6px;box-shadow:0 2px 8px #2b2f5c18}
.card img{width:48px;height:48px;background:#f0f2ff;border-radius:12px;padding:4px}
.card .n{font-weight:700}.card .s{font-size:11px;color:#667}
.hp{height:6px;background:#e6e8f5;border-radius:9px;overflow:hidden;margin:4px 0}.hp i{display:block;height:100%;border-radius:9px}
.pill{display:inline-block;font-size:9px;font-weight:700;color:#fff;border-radius:999px;padding:1px 7px;margin-right:3px;text-transform:uppercase}
.lead{font-size:10px;border:0;border-radius:999px;padding:3px 9px;background:#eef0ff;color:#5b4fd8;font-weight:700;cursor:pointer;margin-left:auto}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{background:#fff;border-radius:12px;padding:6px;text-align:center;font-size:10px;box-shadow:0 2px 8px #2b2f5c14}
.dex img{width:40px;height:40px}.dex .unk img{filter:brightness(0) opacity(.25)}
.main{display:grid;gap:8px;margin-top:20px}.main button{font:inherit;font-size:15px;font-weight:700;padding:12px;border:0;border-radius:14px;background:#fff;color:#2b2f5c;box-shadow:0 2px 8px #2b2f5c18;cursor:pointer;text-align:left}
.main button:hover{background:#5b4fd8;color:#fff}
</style>
</head>
<body>
<div id="gba">
  <div id="screen"><canvas id="c" width="720" height="480"></canvas><div id="box"></div><div id="panel"></div></div>
  <div id="dpad"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="r">▶</button><button data-d="d">▼</button><button id="mbtn">MENU</button></div>
  <div class="label" id="ver">WILDLINGS</div>
</div>
<script>
// Wildlings — an original monster-catching demo. All creatures, art and names are original.
const VERSION='0.4.0',BUILT='15 Nov 2026 10:20';
document.getElementById('ver').textContent=`WILDLINGS · v${VERSION} · ${BUILT}`;
const dpad=document.getElementById('dpad');
const cv=document.getElementById('c'),g=cv.getContext('2d'),box=document.getElementById('box');
g.setTransform(3,0,0,3,0,0);const panel=document.getElementById('panel');
const TC={flame:'#f0643c',tide:'#3f8fe0',leaf:'#3fae5a',ground:'#b98a4a',psychic:'#e05aa8',poison:'#9b59c9',plain:'#9a9aa8'};

// ---- Types & moves ----
const EFF={flame:{leaf:2,tide:.5,flame:.5,ground:.5},tide:{flame:2,ground:2,leaf:.5,tide:.5},leaf:{tide:2,ground:2,flame:.5,leaf:.5,poison:.5},
  ground:{flame:2,poison:2,leaf:.5},psychic:{poison:2,psychic:.5},poison:{leaf:2,poison:.5,ground:.5},plain:{}};
const TY=t=>[].concat(t);
const MOVES={
  Scratch:{type:'plain',pow:40,acc:100},Tackle:{type:'plain',pow:40,acc:100},
  Cinder:{type:'flame',pow:45,acc:100},Splash:{type:'tide',pow:45,acc:100},Thornshot:{type:'leaf',pow:45,acc:100},
  Growl:{type:'plain',pow:0,acc:100,debuff:'atk'},Nibble:{type:'plain',pow:35,acc:100},Gust:{type:'plain',pow:40,acc:95},Mudslap:{type:'ground',pow:40,acc:100},Mindwave:{type:'psychic',pow:45,acc:100},Peck:{type:'plain',pow:35,acc:100},Venomsting:{type:'poison',pow:40,acc:100},Harden:{type:'plain',pow:0,acc:100,buff:'def'},Dustcloud:{type:'plain',pow:0,acc:90,debuff:'atk'}
};
// ---- Species: pixel art from palette strings (12x12) ----
const SP={
  Lincendo:{type:['flame','ground'],hp:41,atk:56,def:42,spd:66,moves:['Scratch','Cinder','Mudslap'],
    col:{a:'#c9773a',b:'#f3d9a4',c:'#222',e:'#4a2c17'},
    art:["..e......e..","..ae....ea..","..aaaaaaaa..",".aaaaaaaaaa.",".aacaaaacaa.","eaaaabbaaaae","ebaabbbbaabe","..aaaaaaaa..","..aeaaaaea..","..aaaaaaaa..","..aa....aa..","............"]},
  Platymind:{type:['tide','psychic'],hp:46,atk:46,def:60,spd:45,moves:['Splash','Mindwave','Growl'],
    col:{a:'#3f7fbf',b:'#5a3d22',c:'#fff',e:'#e070d0'},
    art:["............","....e.......","...aaaaa....","..aaaaaaa...","..acaaaaa...","bbbaaaaaaaa.","bbbaaaaaaaaa","...aaaaaaaaa","...aaaaaaaaa","....a..a.aaa","..........aa","............"]},
  Venibri:{type:['leaf','poison'],hp:40,atk:50,def:40,spd:72,moves:['Peck','Thornshot','Venomsting'],
    col:{a:'#3cb371',b:'#8e5cc7',c:'#222',e:'#333',f:'#c2185b'},
    art:["............","......aaa...",".....aacaa..","eeeeeaaaaa..",".....fffa...","..bb.aaaa...",".bbbbaaaab..","bbbbbaaabbb.","..bbbaaaa...","......aa....",".....aa.....","............"]},



  Pibbit:{type:'plain',hp:35,atk:40,def:35,spd:56,moves:['Nibble','Gust'],
    col:{a:'#b08a5a',b:'#f2dcb4',c:'#222'},
    art:["..a......a..","..aa....aa..","..aa....aa..","...aaaaaa...","..aaaaaaaa..","..acaaaaca..","..aaabbaaa..","...abbbba...","..aaaaaaaa..","..aabbbbaa..","...a....a...","............"]},
  Pebblor:{type:'plain',hp:40,atk:45,def:70,spd:25,moves:['Tackle','Harden'],
    col:{a:'#8d8d8d',b:'#bdbdbd',c:'#222'},
    art:["............","............","....aaaa....","..aabaaaaa..",".aabbaaaaaa.",".aaaaaaaaaa.",".acaaaaaaca.",".aaaaaaaaaa.","aaaaaaaaaaaa","aaaaaaaaaaaa",".aaaaaaaaaa.","............"]},
  Mothwisp:{type:'leaf',hp:38,atk:42,def:38,spd:62,moves:['Gust','Thornshot','Dustcloud'],
    col:{a:'#9b7fd1',b:'#e7dcff',c:'#222',e:'#5e4b8b'},
    art:["...e....e...","....e..e....","bb..aaaa..bb","bbb.aaaa.bbb","bbbbacca.bbb","bbbbaaaabbbb",".bbbaaaabbb.","..bbaaaabb..","...baaaab...","....aaaa....",".....aa.....","............"]},
  Coralisk:{type:'tide',hp:42,atk:55,def:58,spd:35,moves:['Nibble','Splash','Harden'],
    col:{a:'#ff7f6e',b:'#ffd2c8',c:'#222',e:'#c94a3c'},
    art:["e..........e","ee........ee",".ee......ee.","..eaaaaaae..","..aacaacaa..",".aaaaaaaaaa.","aaabbbbbbaaa","aaabbbbbbaaa",".aaaaaaaaaa.","a.a.a..a.a.a","............","............"]},
  Hootle:{type:'plain',hp:45,atk:44,def:40,spd:50,moves:['Gust','Nibble','Growl'],
    col:{a:'#7b5b3b',b:'#e9cf9f',c:'#222',e:'#f2b134'},
    art:["..a......a..","..aa....aa..","..aaaaaaaa..",".abbbaabbba.",".abcbaabcba.",".abbbeebbba.",".aaaaeeaaaa.",".aabbbbbbaa.",".aabbbbbbaa.","..aaaaaaaa..","...e....e...","............"]},
  Fumepot:{type:'flame',hp:36,atk:58,def:45,spd:40,moves:['Cinder','Tackle','Dustcloud'],
    col:{a:'#3d4a5c',b:'#ff9f43',c:'#fff',e:'#ccc'},
    art:[".....e......","....e.e.....","....bbb.....","...aaaaa....","..aaaaaaa...","aaacaaacaa..","a.aaaaaaaaaa","a.aaaaaaaa.a",".aaaaaaaaa.a","..aaaaaaa...","...aaaaa....","............"]}
};
function mk(name,lv){const s=SP[name],st=k=>Math.floor(s[k]*lv/50)+5;
  const m={name,lv,type:s.type,maxhp:Math.floor(s.hp*lv/50)+lv+10,atk:st('atk'),def:st('def'),spd:st('spd'),moves:s.moves.slice(),atkMod:1};
  m.hp=m.maxhp;return m}

// ---- State ----
let S={scene:'title',player:'',party:[],orbs:5,wild:null,anim:0,shake:0,flash:0,seen:[],caught:[]};
const mark=(k,n)=>{if(!S[k].includes(n))S[k].push(n)};
function drawMon(name,x,y,scale,flip,ctx=g){const s=SP[name],r=scale*.38;
  ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(x+6*scale,y+12*scale,4.5*scale,scale*.9,0,0,7);ctx.fill();
  s.art.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==='.')return;ctx.fillStyle=s.col[ch];const xi=flip?11-i:i;
    ctx.beginPath();ctx.roundRect(x+xi*scale-.15,y+j*scale-.15,scale+.3,scale+.3,r);ctx.fill()}))}
const spriteCache={};function sprite(n){if(spriteCache[n])return spriteCache[n];const c=document.createElement('canvas');c.width=c.height=96;
  const x=c.getContext('2d');drawMon(n,0,-6,8,false,x);return spriteCache[n]=c.toDataURL()}
const pills=t=>TY(t).map(k=>`<span class="pill" style="background:${TC[k]}">${k}</span>`).join('');
function bar(x,y,m,showNum){g.save();g.shadowColor='#0003';g.shadowBlur=6;g.shadowOffsetY=2;g.fillStyle='#ffffffee';g.beginPath();g.roundRect(x,y,98,showNum?30:24,8);g.fill();g.restore();
  g.fillStyle='#1d2233';g.font='600 8px system-ui,sans-serif';g.fillText(m.name,x+7,y+10);g.font='7px system-ui,sans-serif';g.fillStyle='#667';g.fillText('Lv'+m.lv,x+76,y+10);
  TY(m.type).forEach((t,k)=>{g.fillStyle=TC[t];g.beginPath();g.arc(x+64-k*6,y+7.5,2.4,0,7);g.fill()});
  const p=Math.max(0,m.hp/m.maxhp);g.fillStyle='#e6e8f5';g.beginPath();g.roundRect(x+7,y+14,84,4,2);g.fill();
  const gr=g.createLinearGradient(x+7,0,x+91,0);const c=p>.5?['#3ddc84','#26b56a']:p>.2?['#ffd166','#f4a92a']:['#ff6b6b','#e03e3e'];gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);
  g.fillStyle=gr;if(p>0){g.beginPath();g.roundRect(x+7,y+14,Math.max(4,84*p),4,2);g.fill()}
  if(showNum){g.fillStyle='#667';g.font='7px system-ui,sans-serif';g.fillText(m.hp+' / '+m.maxhp,x+60,y+26)}}

function render(){S.anim++;g.clearRect(0,0,240,160);g.imageSmoothingEnabled=true;
  if(S.scene==='title'){let gr=g.createLinearGradient(0,0,0,160);gr.addColorStop(0,'#8ec5ff');gr.addColorStop(1,'#e0f0ff');g.fillStyle=gr;g.fillRect(0,0,240,160);
    g.fillStyle='#fff9';[[40,30],[180,22],[120,45]].forEach(([cx,cy],k)=>{const o=(S.anim/8+k*60)%280-20;g.beginPath();g.ellipse(o,cy,16,6,0,0,7);g.fill()});
    g.fillStyle='#6fcf6f';g.beginPath();g.ellipse(120,150,170,55,0,0,7);g.fill();
    g.textAlign='center';g.fillStyle='#2b2f5c';g.font='800 24px system-ui,sans-serif';g.fillText('WILDLINGS',120,40);g.font='500 8px system-ui,sans-serif';g.fillStyle='#4b5080';g.fillText('a tiny monster-catching adventure',120,53);g.font='600 7px system-ui,sans-serif';g.fillStyle='#4b508099';g.fillText('v'+VERSION,120,63);g.textAlign='left';
    const b=Math.sin(S.anim/10)*2;drawMon('Lincendo',40,70+b,3);drawMon('Platymind',102,70-b,3);drawMon('Venibri',164,70+b,3)}
  else if(S.scene==='lab'){g.fillStyle='#e9dcc0';g.fillRect(0,0,240,160);g.fillStyle='#c9b48a';for(let i=0;i<240;i+=16)g.fillRect(i,0,1,160);
    g.fillStyle='#7a5a3a';g.fillRect(20,62,200,14);['Lincendo','Platymind','Venibri'].forEach((n,i)=>{const sel=S.pick===i;
      drawMon(n,32+i*66,24+(sel?Math.sin(S.anim/5)*2:0),3);if(sel){g.strokeStyle='#5b4fd8';g.lineWidth=2;g.beginPath();g.roundRect(28+i*66,20,44,44,10);g.stroke();g.lineWidth=1}})}
  else if(S.scene==='town'){MAP.forEach((r,y)=>[...r].forEach((c,x)=>tile(c,x,y)));drawPlayer()}
  else if(S.scene==='battle'){let bg=g.createLinearGradient(0,0,0,160);bg.addColorStop(0,'#cfeaff');bg.addColorStop(.55,'#e8f7d8');bg.addColorStop(1,'#bfe3a0');g.fillStyle=bg;g.fillRect(0,0,240,160);g.fillStyle='#9fd27e';
    g.beginPath();g.ellipse(170,62,40,9,0,0,7);g.fill();g.beginPath();g.ellipse(64,112,46,10,0,0,7);g.fill();
    const w=S.wild,me=S.party[0];
    if(w&&!w.caught){const sx=S.shake?Math.sin(S.anim)*3:0;if(S.inOrb){g.fillStyle='#d33';g.beginPath();g.arc(170+Math.sin(S.anim/2)*(S.wobble?3:0),52,7,Math.PI,0);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(170+Math.sin(S.anim/2)*(S.wobble?3:0),52,7,0,Math.PI);g.fill();g.strokeStyle='#222';g.stroke()}
      else if(w.hp>0||S.faintAnim)drawMon(w.name,146+sx,18,4)}
    if(me)drawMon(me.name,34,62,4,true);
    if(w)bar(8,6,w,false);if(me)bar(136,78,me,true);
    if(S.flash>0){g.fillStyle='#fff8';g.fillRect(0,0,240,160);S.flash--}if(S.shake>0)S.shake--}
  requestAnimationFrame(render)}
render();


// ---- Town ----
const MAP=[
"TTTTTTTTTTTTTTT",
"T..GGGGG..WWWWT",
"T..GGGGG..WWWWT",
"T..GGGGG...WWWT",
"T.....=.......T",
"T.HH..=...LLL.T",
"T.HD..=...LDL.T",
"T=====+=======T",
"T.GG.....f.GG.T",
"TTTTTTTTTTTTTTT"];
const solid=c=>'TWHLf'.includes(c);
function tile(c,x,y){const X=x*16,Y=y*16;
  g.fillStyle='#8ccf6a';g.fillRect(X,Y,16,16);
  if(c==='='||c==='+'||c==='D'&&0){g.fillStyle='#d9c08a';g.fillRect(X,Y,16,16)}
  if(c==='='||c==='+'){g.fillStyle='#d9c08a';g.fillRect(X,Y,16,16)}
  if(c==='G'){g.fillStyle='#3f9a3a';for(let i=0;i<4;i++){g.fillRect(X+i*4,Y+6+(i%2)*2,2,8);g.fillRect(X+i*4+2,Y+4+(i%2)*3,1,9)}}
  if(c==='T'){g.fillStyle='#6b4a2b';g.fillRect(X+6,Y+10,4,6);g.fillStyle='#2f7d32';g.beginPath();g.arc(X+8,Y+7,7,0,7);g.fill()}
  if(c==='W'){g.fillStyle='#4a9be0';g.fillRect(X,Y,16,16);g.fillStyle='#bfe6ff';g.fillRect(X+2+(S.anim>>4)%6,Y+5,5,1);g.fillRect(X+8-(S.anim>>4)%5,Y+11,4,1)}
  if(c==='H'||c==='D'&&MAP[y][x-1]==='H'){g.fillStyle='#e9e2d0';g.fillRect(X,Y,16,16);g.fillStyle='#c0504d';if(MAP[y-1]&&MAP[y-1][x]!=='H'&&MAP[y-1][x]!=='D')g.fillRect(X,Y,16,7)}
  if(c==='L'||c==='D'&&MAP[y][x-1]==='L'){g.fillStyle='#eef2f7';g.fillRect(X,Y,16,16);g.fillStyle='#4a6fa5';if(MAP[y-1]&&!'LD'.includes(MAP[y-1][x]))g.fillRect(X,Y,16,7)}
  if(c==='D'){g.fillStyle='#6b4a2b';g.fillRect(X+4,Y+4,8,12)}
  if(c==='f'){g.fillStyle='#d9c08a';g.fillRect(X,Y,16,16);g.fillStyle='#7a5a3a';g.fillRect(X+7,Y+8,2,8);g.fillStyle='#c9a46a';g.fillRect(X+2,Y+3,12,6)}}
function drawPlayer(){const X=S.px*16,Y=S.py*16,b=S.step%2;
  g.fillStyle='#0003';g.fillRect(X+3,Y+13,10,3);
  g.fillStyle='#d33';g.fillRect(X+4,Y+1,8,4);g.fillStyle='#f1c27d';g.fillRect(X+5,Y+4,6,4);
  g.fillStyle='#222';if(S.face!=='u'){g.fillRect(X+6+(S.face==='r'?1:S.face==='l'?-1:0),Y+5,1,1);g.fillRect(X+9+(S.face==='r'?1:S.face==='l'?-1:0),Y+5,1,1)}
  g.fillStyle='#3060c0';g.fillRect(X+4,Y+8,8,4);g.fillStyle='#333';g.fillRect(X+5,Y+12,2,3-b);g.fillRect(X+9,Y+12,2,2+b)}
let townResolve=null;
function goTown(){S.scene='town';box.className='hide';S.busy=false;dpad.style.visibility='visible'}
async function move(dir){if(S.scene!=='town'||S.busy)return;
  const d={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[dir];S.face=dir;
  const nx=S.px+d[0],ny=S.py+d[1],c=MAP[ny][nx];
  if(c==='D'){S.busy=true;
    if(MAP[ny][nx-1]==='L'){S.party.forEach(m=>{m.hp=m.maxhp;m.atkMod=1});S.orbs=Math.max(S.orbs,5);
      await say(`PROF. ALDER: Your team is fully healed! Orbs topped up to ${S.orbs}.`);
      await say(`Team: ${S.party.map(m=>m.name+' Lv'+m.lv).join(', ')}`)}
    else await say("It's your house. Mom says: don't forget to come home for dinner!");
    goTown();return}
  if(c==='f'){S.busy=true;await say('SIGN: Maplewick Town. Tall grass ahead — wild Wildlings live there!');goTown();return}
  if(solid(c))return;
  S.px=nx;S.py=ny;S.step++;
  if(c==='G'&&Math.random()<.18){S.busy=true;dpad.style.visibility='hidden';
    S.flash=8;await wait(400);battleLoop()}}
addEventListener('keydown',e=>{const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'}[e.key];if(k){e.preventDefault();move(k)}});

// ---- Dialog helpers ----
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(t,opts){return new Promise(res=>{box.className='';box.innerHTML='<div>'+t+'</div>';
  if(opts){const m=document.createElement('div');m.id='menu';opts.forEach(o=>{const b=document.createElement('button');b.innerHTML=o.label;b.disabled=!!o.disabled;b.onclick=()=>res(o.v);m.appendChild(b)});box.appendChild(m);m.querySelector('button:not([disabled])')?.focus()}
  else{const go=()=>{box.onclick=null;document.onkeydown=null;res()};setTimeout(()=>{box.onclick=go;document.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')go()}},150);box.innerHTML+='<div style="text-align:right">▼</div>'}})}
function ask(t){return new Promise(res=>{box.className='';box.innerHTML='<div>'+t+'</div><input id="nm" maxlength="10" autocomplete="off"><div id="menu"><button id="ok">OK</button></div>';
  const i=document.getElementById('nm');i.focus();const go=()=>{const v=i.value.trim();if(v)res(v)};document.getElementById('ok').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}})}


// ---- Start menu, team, dex, save ----
const SAVE='wildlings-save';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({player:S.player,party:S.party,orbs:S.orbs,px:S.px,py:S.py,seen:S.seen,caught:S.caught}));return true}catch{return false}}
function load(){try{return JSON.parse(localStorage.getItem(SAVE))}catch{return null}}
function closePanel(){panel.className='';panel.innerHTML='';S.busy=false}
function openMenu(){if(S.scene!=='town'||S.busy)return;S.busy=true;panel.className='on';
  panel.innerHTML=`<h3>${S.player}<button class="x">✕</button></h3><div class="s" style="color:#667">Orbs: ${S.orbs} · Caught: ${S.caught.length}/${Object.keys(SP).length} · v${VERSION}</div>
  <div class="main"><button data-a="team">🐾 Team</button><button data-a="dex">📖 Wildlingdex</button><button data-a="save">💾 Save</button><button data-a="close">↩ Back to game</button></div>`;
  panel.querySelector('.x').onclick=closePanel;
  panel.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>({team:showTeam,dex:showDex,close:closePanel,
    save:()=>{b.textContent=save()?'✅ Saved!':'⚠ Could not save';setTimeout(()=>b.textContent='💾 Save',1200)}})[b.dataset.a]())}
function showTeam(){panel.innerHTML=`<h3>Team<button class="x">‹ Menu</button></h3>`+S.party.map((m,i)=>{const p=m.hp/m.maxhp,c=p>.5?'#3ddc84':p>.2?'#ffd166':'#ff6b6b';
  return `<div class="card"><img src="${sprite(m.name)}"><div style="flex:1"><div class="n">${m.name} <span class="s">Lv${m.lv}</span> ${i===0?'<span class="pill" style="background:#5b4fd8">lead</span>':''}</div>
  <div>${pills(m.type)}</div><div class="hp"><i style="width:${p*100}%;background:${c}"></i></div>
  <div class="s">HP ${m.hp}/${m.maxhp} · ATK ${m.atk} · DEF ${m.def} · SPD ${m.spd}<br>${m.moves.join(' · ')}</div></div>
  ${i?`<button class="lead" data-i="${i}">Make lead</button>`:''}</div>`}).join('');
  panel.querySelector('.x').onclick=()=>{S.busy=false;openMenu()};
  panel.querySelectorAll('.lead').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;[S.party[0],S.party[i]]=[S.party[i],S.party[0]];showTeam()})}
function showDex(){panel.innerHTML=`<h3>Wildlingdex<button class="x">‹ Menu</button></h3><div class="dex">`+Object.keys(SP).map((n,i)=>{const c=S.caught.includes(n),sn=S.seen.includes(n);
  return `<div class="${sn?'':'unk'}"><img src="${sprite(n)}"><div><b>#${String(i+1).padStart(2,'0')}</b> ${sn?n:'???'}</div><div>${sn?pills(SP[n].type):''}</div><div class="s">${c?'● caught':sn?'○ seen':''}</div></div>`}).join('')+'</div>';
  panel.querySelector('.x').onclick=()=>{S.busy=false;openMenu()}}
document.getElementById('mbtn').onclick=e=>{e.preventDefault();panel.className?closePanel():openMenu()};
addEventListener('keydown',e=>{if(['Escape','m','M'].includes(e.key)||(e.key==='Enter'&&S.scene==='town'&&!S.busy)){if(panel.className)closePanel();else openMenu()}});

// ---- Story ----
async function start(){
  S.scene='title';const sv=load();
  const pickT=await say('Welcome, trainer!',[{label:'▶ New game',v:'n'},{label:'⟳ Continue',v:'c',disabled:!sv}]);
  if(pickT==='c'){Object.assign(S,{player:sv.player,party:sv.party,orbs:sv.orbs,px:sv.px,py:sv.py,seen:sv.seen||[],caught:sv.caught||[],face:'d',step:0});
    await say(`Welcome back, ${S.player}!`);goTown();return}
  S.scene='lab';S.pick=-1;
  await say('PROF. ALDER: Welcome to the world of WILDLINGS — creatures living in every meadow, river and ember-field.');
  S.player=await ask("First, what's your name?");
  await say(`${S.player}! What a fine name. Before you head out, you'll need a partner.`);
  const info={Lincendo:'a FLAME/GROUND Iberian lynx with a smouldering beard. Fast and fierce!',Platymind:'a TIDE/PSYCHIC platypus that senses thoughts through its bill. Tough!',Venibri:'a LEAF/POISON hummingbird with a venomous beak. The fastest of the three!'};
  let choice;
  while(!choice){const i=await say('Choose your first Wildling:',['Lincendo','Platymind','Venibri'].map((n,k)=>({label:n,v:k})));
    S.pick=i;const n=['Lincendo','Platymind','Venibri'][i];
    if(await say(`${n} — ${info[n]} Take it?`,[{label:'Yes',v:1},{label:'No',v:0}]))choice=n;else S.pick=-1}
  S.party=[mk(choice,5)];mark('seen',choice);mark('caught',choice);
  await say(`${S.player} received ${choice}! Here are 5 CATCH ORBS too. Weaken a wild Wildling, then throw one!`);
  await say('Explore Maplewick Town! Walk in the tall grass to meet wild Wildlings, and come back to the LAB door to heal.');
  S.px=11;S.py=7;S.face='d';S.step=0;goTown()}

function dmg(a,d,mv){const m=MOVES[mv];if(!m.pow)return{d:0,e:1};
  const e=TY(d.type).reduce((x,t)=>x*((EFF[m.type]||{})[t]||1),1),stab=TY(a.type).includes(m.type)?1.5:1,crit=Math.random()<.0625?1.5:1;
  const base=((2*a.lv/5+2)*m.pow*(a.atk*a.atkMod)/d.def)/50+2;
  return{d:Math.max(1,Math.floor(base*e*stab*crit*(.85+Math.random()*.15))),e,crit:crit>1}}
async function useMove(a,d,mv,mine){const who=mine?a.name:'Wild '+a.name;
  await say(`${who} used ${mv}!`);
  if(Math.random()*100>MOVES[mv].acc){await say('But it missed!');return}
  if(MOVES[mv].buff){a.def=Math.ceil(a.def*1.25);await say(`${who}'s defense rose!`);return}
  if(MOVES[mv].debuff){d.atkMod=Math.max(.5,d.atkMod*.8);await say(`${mine?'Wild '+d.name:d.name}'s attack fell!`);return}
  const r=dmg(a,d,mv);S.shake=12;S.flash=3;d.hp=Math.max(0,d.hp-r.d);await wait(300);
  if(r.crit)await say('A critical hit!');if(r.e>1)await say("It's super effective!");else if(r.e<1)await say("It's not very effective...")}

async function battleLoop(){
  const pool=['Pibbit','Pibbit','Pebblor','Mothwisp','Coralisk','Hootle','Hootle','Fumepot','Lincendo','Platymind','Venibri'];
  S.wild=mk(pool[Math.floor(Math.random()*pool.length)],3+Math.floor(Math.random()*3));S.inOrb=false;
  S.scene='battle';const w=S.wild,me=S.party[0];me.atkMod=1;
  mark('seen',w.name);await say(`A wild ${w.name} appeared!`);await say(`Go, ${me.name}!`);
  while(true){
    const act=await say(`What will ${me.name} do?`,[{label:'FIGHT',v:'f'},{label:`ORB ×${S.orbs}`,v:'o',disabled:!S.orbs},{label:'TEAM',v:'h'},{label:'RUN',v:'r'}]);
    if(act==='r'){await say('Got away safely!');break}
    if(act==='h'){await say(S.party.map(m=>`${m.name} Lv${m.lv} ${m.hp}/${m.maxhp}`).join('<br>'));continue}
    if(act==='f'){const mv=await say('Choose a move:',me.moves.map(m=>({label:`${m} <span class="t">${MOVES[m].type.toUpperCase()}</span>`,v:m})).concat([{label:'BACK',v:null}]));
      if(!mv)continue;
      const first=me.spd>=w.spd;
      if(first){await useMove(me,w,mv,true);if(w.hp>0)await useMove(w,me,pick(w),false)}
      else{await useMove(w,me,pick(w),false);if(me.hp>0)await useMove(me,w,mv,true)}}
    if(act==='o'){S.orbs--;await say(`${S.player} threw a CATCH ORB!`);S.inOrb=true;
      const rate=(3*w.maxhp-2*w.hp)/(3*w.maxhp);let shakes=0;S.wobble=true;
      for(let i=0;i<3;i++){await wait(650);if(Math.random()<Math.pow(rate,.6)*0.9+.05)shakes++;else break}
      S.wobble=false;
      if(shakes===3){w.caught=true;S.party.push(w);mark('caught',w.name);await say(`Gotcha! ${w.name} was caught!`);
        await say(`${w.name} joined ${S.player}'s team. Team size: ${S.party.length}.`);break}
      S.inOrb=false;await say(['Oh no! It broke free!','Argh! Almost had it!','Shoot! So close!'][Math.min(shakes,2)]);
      await useMove(w,me,pick(w),false)}
    if(w.hp<=0){await say(`Wild ${w.name} fainted!`);const xp=w.lv*8;await say(`${me.name} gained ${xp} XP.`);
      if(Math.random()<.5){me.lv++;me.maxhp+=3;me.hp=Math.min(me.maxhp,me.hp+3);me.atk++;me.def++;await say(`${me.name} grew to Lv ${me.lv}!`)}break}
    if(me.hp<=0){await say(`${me.name} fainted! ${S.player} hurried back to the lab...`);S.party.forEach(m=>m.hp=m.maxhp);S.px=11;S.py=7;break}}
  S.wild=null;S.inOrb=false;save();goTown()}
function pick(m){return m.moves[Math.floor(Math.random()*m.moves.length)]}
dpad.querySelectorAll('button[data-d]').forEach(b=>{let t;const go=()=>move(b.dataset.d);b.onpointerdown=e=>{e.preventDefault();go();t=setInterval(go,180)};b.onpointerup=b.onpointerleave=()=>clearInterval(t)});
start();
</script>
