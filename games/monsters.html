function interactAt(x,y){if(NP().some(n=>n.x===x&&n.y===y))return[x,y];if(M.signs&&M.signs[x+','+y])return[x,y];if(S.camps.some(c=>c.map===S.map&&c.x===x&&c.y===y))return[x,y];
  const b=M.bld.find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);if(b)return[b.door[0],b.door[1],1];if(!M.indoor&&(M.rows[y]||'')[x]==='T')return[x,y];return null}
function goTo(tx,ty,it){const W=M.rows[0].length,H=M.rows.length,key=(x,y)=>y*W+x,prev=new Map([[key(S.px,S.py),null]]),q=[[S.px,S.py]];
  while(q.length){const[cx,cy]=q.shift();for(const[d,dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H||prev.has(key(nx,ny))||blocked(nx,ny))continue;
      prev.set(key(nx,ny),[cx,cy,d]);if(!(M.warps&&M.warps[nx+','+ny]))q.push([nx,ny])}}
  let goal=null,end=null;
  if(it){const cands=(it[2]?[['u',0,1]]:[['u',0,1],['d',0,-1],['l',1,0],['r',-1,0]]).map(([d,ox,oy])=>[it[0]+ox,it[1]+oy,d]).filter(c=>prev.has(key(c[0],c[1])));
    if(!cands.length)return;const len=c=>{let n=0,k=prev.get(key(c[0],c[1]));while(k){n++;k=prev.get(key(k[0],k[1]))}return n};cands.sort((a,b)=>len(a)-len(b));goal=cands[0];end=goal[2]}
  else{let best=1e9;for(const k of prev.keys()){const x=k%W,y=(k-x)/W,dd=Math.abs(x-tx)+Math.abs(y-ty);if(dd<best){best=dd;goal=[x,y]}}if(!goal||best>3)return}
  const path=[];let c=prev.get(key(goal[0],goal[1]));while(c){path.unshift(c[2]);c=prev.get(key(c[0],c[1]))}
  S.path=path;S.pathEnd=end;S.dest=it?[it[0],it[1]]:[goal[0],goal[1]];pathStep()}
let CTL=localStorage.getItem('wildlings-ctl')||'tap';const setCtl=v=>{CTL=v;try{localStorage.setItem('wildlings-ctl',v)}catch{}document.body.classList.toggle('arrows',v==='arrows')};setCtl(CTL);
const bond=m=>m.bond||(m.bond={f:10,l:10,h:30});const PALCD={};
const bondBars=m=>{const b=bond(m);return [['❤️','Friendship',b.f,'#ff6b9a'],['🛡','Loyalty',b.l,'#5b8def'],['😊','Happiness',b.h,'#ffc145']].map(([e,n,v,c])=>`<div class="sbar" style="grid-template-columns:86px 1fr 24px;font-size:10.5px">${e} ${n}<span style="background:#e6e8f5;border-radius:9px"><i style="width:${v}%;background:${c}"></i></span>${v}</div>`).join('')};
async function palMenu(m){S.busy=true;S.path=null;S.pathEnd=null;S.dest=null;const b=bond(m),up=(k,n)=>{b[k]=Math.max(0,Math.min(100,b[k]+n))};
  const a=await say(`${m.name} ${b.h>=60?'bounces around you happily':b.h>=30?'looks up at you':'seems a bit down'}.<div style="margin-top:4px">${bondBars(m)}</div>`,[{label:'🤚 Pet',v:'pet'},{label:'🎾 Play',v:'play'},{label:`🫐 Feed berry ×${S.bag.berry}`,v:'feed',disabled:!S.bag.berry},{label:'💬 Praise',v:'praise'},{label:'Close',v:0}]);
  if(a){const k=m.name+a,now=Date.now();if(a!=='feed'&&now-(PALCD[k]||0)<25000)await say(`${m.name} is content for now — try something else or come back in a moment.`);
    else{PALCD[k]=now;let t='';
      if(a==='pet'){up('f',6);up('h',2);t=`You pet ${m.name}. It nuzzles your hand! ❤️ Friendship +6 · 😊 +2`}
      if(a==='play'){up('h',8);up('f',2);t=`You play chase with ${m.name}. It's having a blast! 😊 Happiness +8 · ❤️ +2`}
      if(a==='feed'){S.bag.berry--;up('h',5);up('f',4);m.hp=Math.min(m.maxhp,m.hp+20);t=`${m.name} munches the berry. Yum! 😊 +5 · ❤️ +4 · +20 HP`}
      if(a==='praise'){up('l',6);up('f',1);t=`You tell ${m.name} how well it's doing. It stands a little taller. 🛡 Loyalty +6 · ❤️ +1`}
      S.flash=4;await say(t)}}
  save();goTown()}
function tapAt(cx,cy){if(T3&&S.scene==='town'&&!S.busy&&!panel.className&&box.className==='hide'){const lead=S.party.find(m=>m.hp>0)||S.party[0];if(lead){const[fx,fy]=T3.project(S.follow[0],S.follow[1],.3);if(Math.hypot(fx-cx,fy-cy)<30&&!(S.follow[0]===S.px&&S.follow[1]===S.py)){palMenu(lead);return}}}
  if(CTL==='arrows')return;if(!T3||S.scene!=='town'||S.busy||panel.className||box.className!=='hide')return;
  let it=null,bd=34;const cand=[...NP().map(n=>[n.x,n.y,.55]),...S.camps.filter(c=>c.map===S.map).map(c=>[c.x,c.y,.4]),...Object.keys(M.signs||{}).map(k=>[...k.split(',').map(Number),.45])];
  for(const[x,y,h]of cand){const[px,py]=T3.project(x,y,h),dd=Math.hypot(px-cx,py-cy);if(dd<bd){bd=dd;it=[x,y]}}
  const t=T3.pick(cx,cy);if(!it&&!t)return;if(!it)it=interactAt(t[0],t[1]);
  if(it&&it[2]===undefined&&S.px===it[0]&&S.py===it[1])return;goTo(t?t[0]:it[0],t?t[1]:it[1],it)}
(()=>{const sc=document.getElementById('screen');let dn=null,tm=null,holding=false,pos=null;
  const steer=()=>{if(S.pinch){stop();return}if(!holding||!T3||S.scene!=='town'||S.busy){if(S.touchHold){S.touchHold=false;release()}return}const t=T3.pick(pos[0],pos[1]);if(!t)return;
    const dx=t[0]-S.dx,dy=t[1]-S.dy;if(Math.abs(dx)<.6&&Math.abs(dy)<.6){S.hold=null;return}const d=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');S.touchHold=true;if(d!==S.hold){S.hold=d;if(!S.mv)move(d)}};
  const stop=()=>{clearTimeout(tm);clearInterval(iv);if(holding){holding=false;S.touchHold=false;release()}};let iv=null;
  sc.addEventListener('pointerdown',e=>{if(e.target.tagName!=='CANVAS'||e.isPrimary===false){stop();dn=null;return}dn=[e.clientX,e.clientY];pos=dn;try{sc.setPointerCapture(e.pointerId)}catch{}
    clearTimeout(tm);tm=setTimeout(()=>{if(CTL==='arrows')return;if(!dn||S.scene!=='town'||S.busy||panel.className||box.className!=='hide')return;holding=true;S.path=null;S.pathEnd=null;S.dest=null;steer();iv=setInterval(steer,80)},220)});
  sc.addEventListener('pointermove',e=>{if(dn)pos=[e.clientX,e.clientY]});
  const up=e=>{const was=holding,d0=dn;stop();dn=null;if(was||!d0||S.pinch)return;if(Math.hypot(e.clientX-d0[0],e.clientY-d0[1])>14)return;tapAt(e.clientX,e.clientY)};
  sc.addEventListener('pointerup',up);sc.addEventListener('pointercancel',()=>{stop();dn=null})})();
// ---- Wildlingdex overlay ----
const DEXN=(()=>{const o=[];Object.keys(SP).filter(n=>!SP[n].from).sort((a,b)=>{const st=['Lincendo','Platymind','Venibri'];return (st.indexOf(a)+1||9)-(st.indexOf(b)+1||9)}).forEach(n=>{let c=n;while(c){o.push(c);c=SP[c].evo&&SP[c].evo[0]}});return o})(),dexNo=n=>'#'+String(DEXN.indexOf(n)+1).padStart(2,'0');
const baseOf=n=>{while(SP[n].from)n=SP[n].from;return n};
function dexWhere(n){const b=baseOf(n),out=[];for(const m of Object.values(MAPS)){if(m.indoor||m.chunks||!m.rows.some(r=>r.includes('G')))continue;
    const pool=m.pool||(m.name==='Route 1'?['Pibbit','Pebblor','Mothwisp','Hootle','Coralisk','Fumepot','Lincendo','Platymind','Venibri']:['Pibbit','Pebblor','Mothwisp','Hootle','Coralisk']);if(pool.includes(b)||pool.includes(n))out.push(m.name)}return out}
function dexList(){const el=document.getElementById('dex'),sh=el.firstChild;
  sh.innerHTML=`<h3>📖 Wildlingdex <span style="font-size:11px;color:#667">${S.caught.length}/${DEXN.length} caught</span><span><button id="dexT" style="margin-right:4px">🌳 Tree</button><button id="dexX">✕</button></span></h3><div class="dx">`+DEXN.map(n=>`<button data-n="${n}">${S.caught.includes(n)?'<i class="cb"></i>':''}<img src="${sprite(n)}"><span class="no">${dexNo(n)}</span>${n}</button>`).join('')+'</div>';
  sh.querySelector('#dexX').onclick=()=>el.className='';sh.querySelector('#dexT').onclick=dexTree;sh.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>dexShow(b.dataset.n));el.className='on';sh.scrollTop=el._y||0}
function dexShow(n){const el=document.getElementById('dex'),sh=el.firstChild,s=SP[n];el._y=sh.scrollTop;
  const chain=[];let c=baseOf(n);while(c){chain.push(c);c=SP[c].evo&&SP[c].evo[0]}
  const weak=Object.keys(TC).filter(t=>TY(s.type).reduce((x,d)=>x*((EFF[t]||{})[d]||1),1)>1),res=Object.keys(TC).filter(t=>TY(s.type).reduce((x,d)=>x*((EFF[t]||{})[d]||1),1)<1);
  const pl=a=>a.map(k=>`<span class="pill" style="background:${TC[k]}">${k}</span>`).join('')||'—',wh=dexWhere(n);
  const mvl=m=>`${m} <span style="color:#889">(${MOVES[m].type}${MOVES[m].pow?' · '+MOVES[m].pow:' · status'})</span>`;
  sh.innerHTML=`<h3>${dexNo(n)} ${n}<button id="dexB">‹ All</button></h3><div class="dd"><img src="${sprite(n)}"><div style="text-align:center">${pills(s.type)} ${S.caught.includes(n)?'<span class="pill" style="background:#1565c0">● caught</span>':S.seen.includes(n)?'<span class="pill" style="background:#889">seen</span>':'<span class="pill" style="background:#bbb">not seen yet</span>'}</div>
   <div class="row"><b>Classification</b>${clsOf(n).join(' · ')}</div>
   <div class="row"><b>Base stats</b>${[['HP','hp'],['ATK','atk'],['DEF','def'],['SPD','spd']].map(([l,k])=>`<div class="sbar">${l}<span style="background:#e6e8f5;border-radius:9px"><i style="width:${Math.min(100,s[k]/95*100)}%"></i></span>${s[k]}</div>`).join('')}</div>
   <div class="row"><b>Evolution</b><div class="evo">${chain.length>1?chain.map((c,i)=>`${i?`<span>→ Lv ${SP[chain[i-1]].evo[1]} →</span>`:''}<button data-n="${c}"><img src="${sprite(c)}">${c}</button>`).join(''):'Does not evolve'}</div></div>
   <div class="row"><b>Starting moves</b>${s.moves.map(mvl).join('<br>')}</div>
   <div class="row"><b>Learns by level</b>${Object.entries(s.learn||{}).map(([l,m])=>`Lv ${l}: ${mvl(m)}`).join('<br>')||'—'}</div>
   <div class="row"><b>Weak to</b>${pl(weak)}<b style="margin-top:6px">Resists</b>${pl(res)}</div>
   <div class="row"><b>Where to find</b>${wh.length?wh.join(' · '):SP[n].from?'Evolve '+SP[n].from+(dexWhere(SP[n].from).length?'':' (or raise a starter)'):(SP[n].parents?'🧬 Breed '+SP[n].parents.join(' × ')+' (☰ → Breeding)':'Starter from Prof. Alder')}</div></div>`;
  sh.scrollTop=0;sh.querySelector('#dexB').onclick=dexList;sh.querySelectorAll('.evo [data-n]').forEach(b=>b.onclick=()=>dexShow(b.dataset.n))}
document.getElementById('dexBtn').onclick=()=>{document.getElementById('dex')._y=0;dexList()};
// ---- Dev mode ----
const DEV=(()=>{try{return JSON.parse(localStorage.getItem('wildlings-dev'))||{}}catch{return{}}})();
function devOpen(){const el=document.getElementById('dev'),sh=el.firstChild,T=[['god','🛡 God mode — my Wildlings take no damage'],['kill','💥 Auto-kill — my attacks always KO'],['catch','◓ Auto-catch — orbs never fail'],['noenc','🌿 No wild encounters'],['notr','🙈 Trainers ignore me']];
  const free=S.scene==='town'&&!S.busy;
  sh.innerHTML=`<h3>🛠 Dev mode <button id="devX" style="border:0;background:#5b4fd8;color:#fff;border-radius:999px;padding:4px 12px;font-weight:700">✕</button></h3>`+T.map(([k,l])=>`<label>${l}<input type="checkbox" data-k="${k}" ${DEV[k]?'checked':''}></label>`).join('')+
   `<div class="acts"><button data-a="heal">❤️ Restore team</button><button data-a="lv">⬆️ Lead +5 levels</button><button data-a="orbs">◓ +20 orbs</button><button data-a="mats">🪵 +10 materials</button><button data-a="badges">🏅 All badges</button><button data-a="coins">💰 +1000 coins</button><button data-a="bonds">❤️ Max bonds</button></div>
   <select id="devTp" ${free?'':'disabled'}><option value="">🚀 Teleport to…${free?'':' (not during battle/dialog)'}</option>${Object.entries(MAPS).filter(([k,m])=>!m.indoor&&!m.chunks).map(([k,m])=>`<option value="${k}">${m.name}</option>`).join('')}</select><div id="devMsg" style="margin-top:8px;font-size:12px;color:#667"></div>`;
  const msg=t=>sh.querySelector('#devMsg').textContent=t,upd=()=>{localStorage.setItem('wildlings-dev',JSON.stringify(DEV));document.getElementById('devBtn').classList.toggle('act',Object.values(DEV).some(Boolean))};
  sh.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{DEV[c.dataset.k]=c.checked;upd()});
  sh.querySelector('#devX').onclick=()=>el.className='';
  sh.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(!S.party.length&&(a==='heal'||a==='lv')){msg('Start a game first.');return}
    if(a==='heal'){S.party.forEach(m=>{m.hp=m.maxhp;m.atkMod=1});msg('Team restored.')}
    if(a==='lv'){const m=S.lead||S.party[0],n=mk(m.name,m.lv+5);Object.assign(m,n,{xp:0});mark('seen',m.name);mark('caught',m.name);msg(`${m.name} is now Lv ${m.lv}.`)}
    if(a==='orbs'){S.orbs+=20;msg('Orbs: '+S.orbs)}
    if(a==='mats'){Object.keys(S.bag).forEach(k=>S.bag[k]+=10);msg('Materials added.')}
    if(a==='badges'){S.badges=['River','Mind','Ember','Thorn','Frost','Storm'];msg('All 6 badges granted.')}
    if(a==='bonds'){S.party.forEach(m=>Object.assign(bond(m),{f:100,l:100,h:100}));msg('All bonds maxed.')}
    if(a==='coins'){S.coins+=1000;msg('Coins: '+S.coins)}
    if(S.player)save()});
  sh.querySelector('#devTp').onchange=e=>{const k=e.target.value;if(!k||!(S.scene==='town'&&!S.busy))return;const m=MAPS[k];enterMap(k,Math.floor(m.rows[0].length/2),4);save();el.className=''};
  el.className='on'}
document.getElementById('devBtn').onclick=devOpen;document.getElementById('devBtn').classList.toggle('act',Object.values(DEV).some(Boolean));
start();
</script>
