<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Wildlings — demo</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
body{margin:0;background:radial-gradient(circle at 30% 20%,#2c2f4a,#12131c);color:#1d2233;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
#gba{width:min(100vw,480px);background:linear-gradient(160deg,#7b6cf0,#4b3fb0);border-radius:28px;padding:14px;box-shadow:0 20px 50px #0009,inset 0 1px 0 #fff4}
#screen{border-radius:16px;aspect-ratio:3/2;position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px #0003,0 4px 14px #0005;background:#000}
canvas{width:100%;height:100%;display:block;position:relative}
#box{position:absolute;left:8px;right:8px;bottom:8px;min-height:28%;background:#ffffffe8;backdrop-filter:blur(6px);border-radius:14px;padding:9px 12px;font-size:clamp(12px,3.5vw,15px);line-height:1.4;box-shadow:0 6px 18px #0004;animation:pop .18s ease-out}
#box.hide{display:none}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
#menu button{font:inherit;font-weight:600;background:#eef0ff;border:0;border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;color:#2b2f5c;transition:.12s}
#menu button:hover,#menu button:focus{background:#5b4fd8;color:#fff;outline:none;transform:translateY(-1px)}
#menu button:disabled{opacity:.4}
#menu button .t{font-size:.75em;opacity:.7;font-weight:500}
input{font:inherit;padding:6px 10px;border:2px solid #c9cdf5;border-radius:10px;width:100%;outline:none;margin-top:4px}
input:focus{border-color:#5b4fd8}
#dpad{touch-action:none;-webkit-user-select:none;user-select:none;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center;margin-top:12px;visibility:hidden}
#dpad button{font-size:17px;background:#ffffff22;color:#fff;border:0;border-radius:14px;touch-action:manipulation;box-shadow:inset 0 1px 0 #fff3,0 2px 6px #0003}
#dpad button:active{background:#ffffff44;transform:scale(.95)}
#dpad [data-d=u]{grid-area:1/2}#dpad [data-d=l]{grid-area:2/1}#dpad [data-d=r]{grid-area:2/3}#dpad [data-d=d]{grid-area:3/2}
#dpad #mbtn{grid-area:2/2;font-size:11px;font-weight:700;letter-spacing:1px;background:#ffd166;color:#4b3fb0}
.label{color:#ffffffb0;text-align:center;font-weight:700;margin-top:10px;letter-spacing:3px;font-size:11px}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#ffffffe8;color:#2b2f5c;font-weight:700;font-size:13px;padding:5px 16px;border-radius:999px;box-shadow:0 4px 12px #0003;opacity:0;pointer-events:none}
#banner.on{animation:ban 2.4s ease forwards}@keyframes ban{0%{opacity:0;transform:translate(-50%,-8px)}12%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#panel{position:absolute;inset:0;background:linear-gradient(160deg,#f6f7ff,#e3e6ff);padding:10px;overflow:auto;display:none;font-size:13px}
#panel.on{display:block;animation:pop .18s ease-out}
#panel h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;color:#2b2f5c}
#panel .x{border:0;background:#5b4fd8;color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;cursor:pointer}
.card{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px;margin-bottom:6px;box-shadow:0 2px 8px #2b2f5c18}
.card img{width:48px;height:48px;background:#f0f2ff;border-radius:12px;padding:4px}
.card .n{font-weight:700}.card .s{font-size:11px;color:#667}
.hp{height:6px;background:#e6e8f5;border-radius:9px;overflow:hidden;margin:4px 0}.hp i{display:block;height:100%;border-radius:9px}
.pill{display:inline-block;font-size:9px;font-weight:700;color:#fff;border-radius:999px;padding:1px 7px;margin-right:3px;text-transform:uppercase}
.lead{font-size:10px;border:0;border-radius:999px;padding:3px 9px;background:#eef0ff;color:#5b4fd8;font-weight:700;cursor:pointer;margin-left:auto}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{background:#fff;border-radius:12px;padding:6px;text-align:center;font-size:10px;box-shadow:0 2px 8px #2b2f5c14}
.dex img{width:40px;height:40px}.dex .unk img{filter:brightness(0) opacity(.25)}
.main{display:grid;gap:8px;margin-top:20px}.main button{font:inherit;font-size:15px;font-weight:700;padding:12px;border:0;border-radius:14px;background:#fff;color:#2b2f5c;box-shadow:0 2px 8px #2b2f5c18;cursor:pointer;text-align:left}
.main button:hover{background:#5b4fd8;color:#fff}
</style>
</head>

      const roof=sh(new THREE.Mesh(new THREE.ConeGeometry(.75,1,4),mat(b.roof,{roughness:.7})));roof.rotation.y=Math.PI/4;roof.scale.set(b.w*1.08,1.05,b.h*1.12);roof.position.set(cx,2,cz);world.add(roof);
      world.add(box(.22,.6,.22,'#8a5a48',cx+ww*.28,2.2,cz-.2));
      const fz=b.y+b.h-.17,dx=b.door[0]+.5;world.add(box(.62,.92,.06,'#5b3d24',dx,.5,fz));world.add(box(.5,.82,.07,'#7a5230',dx,.48,fz+.01));world.add(ball(.03,'#e8c070',dx+.17,.48,fz+.06));
      for(let i=0;i<b.w;i++)if(b.x+i!==b.door[0]){const wx=b.x+i+.5;world.add(box(.46,.4,.05,'#f7f3ea',wx,.9,fz));world.add(box(.38,.32,.06,'#8fc6e8',wx,.9,fz+.005,{emissive:'#2a5070',roughness:.1,metalness:.3}));world.add(box(.5,.05,.12,'#8a6a48',wx,.68,fz+.04))}
      if(b.label){const l=label(b.label,.9);l.position.set(cx,2.85,cz+.3);world.add(l)}});
    (m.npcs||[]).forEach(n=>{const p=person(n.c,'#3a2a20');p.userData.n=n;npcs.push(p);world.add(p)});
    scene.add(world);camPos=null;follower.position.set(S.follow[0]+.5,0,S.follow[1]+.5)}
  let camPos=null,stage=null,orbT=0,lastInOrb=false;const tgt=new THREE.Vector3(),look=new THREE.Vector3(),M4=new THREE.Matrix4(),Q=new THREE.Quaternion(),V=new THREE.Vector3(),SC=new THREE.Vector3(),E=new THREE.Euler();
  function draw(){const t=performance.now()/1000,w=cv3.clientWidth,h=cv3.clientHeight;
    if(R.domElement.width!==Math.round(w*R.getPixelRatio())){R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
    const battle=S.scene==='battle';
    player.position.set(S.dx+.5,S.mv?Math.abs(Math.sin(t*13))*.04:0,S.dy+.5);
    const want=ROT[S.face]||0;player.rotation.y+=(((want-player.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI)*.3;
    const sw=S.mv?Math.sin(t*13)*.5:0;player.userData.arms[0].rotation.x=sw;player.userData.arms[1].rotation.x=-sw;
    npcs.forEach(p=>{const n=p.userData.n;p.position.x+=(n.x+.5-p.position.x)*.2;p.position.z+=(n.y+.5-p.position.z)*.2;p.rotation.y=ROT[n.face||'d'];p.userData.ex.visible=!!n.alert});
    if(grassI){grassData.forEach(([x,z,hh,ph],i)=>{E.set(Math.sin(t*1.4+ph+x*.3)*.12,ph,Math.cos(t*1.1+ph)*.08);Q.setFromEuler(E);V.set(x,0,z);SC.set(1,hh,1);M4.compose(V,Q,SC);grassI.setMatrixAt(i,M4)});grassI.instanceMatrix.needsUpdate=true}
    water.forEach((wm,i)=>wm.material.opacity=.82+Math.sin(t*1.2+i)*.06);
    const lead=S.lead||S.party.find(m=>m.hp>0)||S.party[0];
    // battle staging in the world
    if(battle&&!stage){const d=DV[S.face];const px=S.px+.5,pz=S.py+.5;stage={d,px,pz,ally:[px+d[0]*1.0,pz+d[1]*1.0],foe:[px+d[0]*2.6,pz+d[1]*2.6]};if(S.wildFrom){stage.foe=[S.wildFrom[0]+.5-d[0]*.9,S.wildFrom[1]+.5-d[1]*.9]}}
    if(!battle)stage=null;
    if(lead){follower.visible=true;follower.set(lead.name,stage?1.05:.75);
      const fx=stage?stage.ally[0]:S.follow[0]+.5,fz=stage?stage.ally[1]:S.follow[1]+.5;follower.position.x+=(fx-follower.position.x)*.15;follower.position.z+=(fz-follower.position.z)*.15;
      follower.position.y=Math.abs(Math.sin(t*(S.mv?13:3)))*(S.mv?.06:.03);
      if(S.hit===lead&&S.shake>0)follower.position.x+=Math.sin(t*80)*.05;follower.children[0].material.opacity=lead.hp<=0&&battle?.35:1}else follower.visible=false;
    if(stage&&S.wild&&!S.wild.caught){foe.visible=true;foe.set(S.wild.name,S.wild.hp>0?1.15:Math.max(.01,foe.children[0].scale.x*.9));foe.position.set(stage.foe[0]+(S.hit===S.wild&&S.shake>0?Math.sin(t*80)*.06:0),Math.abs(Math.sin(t*3))*.03,stage.foe[1]);foe.children[0].visible=!S.inOrb}else foe.visible=false;
    if(S.inOrb&&stage){if(!lastInOrb)orbT=t;const k=Math.min(1,(t-orbT)/.45);orb.visible=true;
      const a=[stage.px,stage.pz],b=stage.foe;orb.position.set(a[0]+(b[0]-a[0])*k,.15+Math.sin(k*Math.PI)*1.1+(k>=1?0:.4*(1-k)),a[1]+(b[1]-a[1])*k);orb.rotation.z=S.wobble&&k>=1?Math.sin(t*12)*.4:t*10*(1-k)}else orb.visible=false;lastInOrb=S.inOrb;

      tgt.set(f[0]*.7+al[0]*.3,.5,f[1]*.7+al[1]*.3);V.set(stage.px-d[0]*1.7+pp[0]*1.3,1.9,stage.pz-d[1]*1.7+pp[1]*1.3)}
    else{tgt.set(S.dx+.5,.5,S.dy+.5);V.copy(tgt).add(M.indoor?new THREE.Vector3(0,5.2,4.4):new THREE.Vector3(0,3.6,4.6))}

// ---- Dialog helpers ----
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(t,opts){return new Promise(res=>{box.className='';box.innerHTML='<div>'+t+'</div>';
  if(opts){const m=document.createElement('div');m.id='menu';opts.forEach(o=>{const b=document.createElement('button');b.innerHTML=o.label;b.disabled=!!o.disabled;b.onclick=()=>res(o.v);m.appendChild(b)});box.appendChild(m);m.querySelector('button:not([disabled])')?.focus()}
  else{const go=()=>{box.onclick=null;document.onkeydown=null;res()};setTimeout(()=>{box.onclick=go;document.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')go()}},150);box.innerHTML+='<div style="text-align:right">▼</div>'}})}
function ask(t){return new Promise(res=>{box.className='';box.innerHTML='<div>'+t+'</div><input id="nm" maxlength="10" autocomplete="off"><div id="menu"><button id="ok">OK</button></div>';
  const i=document.getElementById('nm');i.focus();const go=()=>{const v=i.value.trim();if(v)res(v)};document.getElementById('ok').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}})}


// ---- Start menu, team, dex, save ----
const SAVE='wildlings-save';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({player:S.player,party:S.party,orbs:S.orbs,px:S.px,py:S.py,seen:S.seen,caught:S.caught,coins:S.coins,beaten:S.beaten,badges:S.badges,map:S.map}));return true}catch{return false}}
function load(){try{return JSON.parse(localStorage.getItem(SAVE))}catch{return null}}
function closePanel(){panel.className='';panel.innerHTML='';S.busy=false}
function openMenu(){if(S.scene!=='town'||S.busy)return;S.busy=true;panel.className='on';
  panel.innerHTML=`<h3>${S.player}<button class="x">✕</button></h3><div class="s" style="color:#667">Orbs: ${S.orbs} · Coins: ${S.coins} · Badges: ${S.badges.length?S.badges.map(b=>'🏅'+b).join(' '):'none'} · Caught: ${S.caught.length}/${Object.keys(SP).length} · v${VERSION}</div>
  <div class="main"><button data-a="team">🐾 Team</button><button data-a="dex">📖 Wildlingdex</button><button data-a="save">💾 Save</button><button data-a="close">↩ Back to game</button></div>`;
  panel.querySelector('.x').onclick=closePanel;
  panel.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>({team:showTeam,dex:showDex,close:closePanel,
    save:()=>{b.textContent=save()?'✅ Saved!':'⚠ Could not save';setTimeout(()=>b.textContent='💾 Save',1200)}})[b.dataset.a]())}
function showTeam(){panel.innerHTML=`<h3>Team<button class="x">‹ Menu</button></h3>`+S.party.map((m,i)=>{const p=m.hp/m.maxhp,c=p>.5?'#3ddc84':p>.2?'#ffd166':'#ff6b6b';
  return `<div class="card"><img src="${sprite(m.name)}"><div style="flex:1"><div class="n">${m.name} <span class="s">Lv${m.lv}</span> ${i===0?'<span class="pill" style="background:#5b4fd8">lead</span>':''}</div>
  <div>${pills(m.type)}</div><div class="hp"><i style="width:${p*100}%;background:${c}"></i></div>
  <div class="s">HP ${m.hp}/${m.maxhp} · ATK ${m.atk} · DEF ${m.def} · SPD ${m.spd}<br>${m.moves.join(' · ')}</div></div>
  ${i?`<button class="lead" data-i="${i}">Make lead</button>`:''}</div>`}).join('');
  panel.querySelector('.x').onclick=()=>{S.busy=false;openMenu()};
  panel.querySelectorAll('.lead').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;[S.party[0],S.party[i]]=[S.party[i],S.party[0]];showTeam()})}
function showDex(){panel.innerHTML=`<h3>Wildlingdex<button class="x">‹ Menu</button></h3><div class="dex">`+Object.keys(SP).map((n,i)=>{const c=S.caught.includes(n),sn=S.seen.includes(n);
  return `<div class="${sn?'':'unk'}"><img src="${sprite(n)}"><div><b>#${String(i+1).padStart(2,'0')}</b> ${sn?n:'???'}</div><div>${sn?pills(SP[n].type):''}</div><div class="s">${c?'● caught':sn?'○ seen':''}</div></div>`}).join('')+'</div>';
  panel.querySelector('.x').onclick=()=>{S.busy=false;openMenu()}}
document.getElementById('mbtn').onclick=e=>{e.preventDefault();panel.className?closePanel():openMenu()};
addEventListener('keydown',e=>{if(['Escape','m','M'].includes(e.key)||(e.key==='Enter'&&S.scene==='town'&&!S.busy)){if(panel.className)closePanel();else openMenu()}});

// ---- Story ----
async function start(){
  S.scene='title';const sv=load();
  const pickT=await say('Welcome, trainer!',[{label:'▶ New game',v:'n'},{label:'⟳ Continue',v:'c',disabled:!sv}]);
  if(pickT==='c'){Object.assign(S,{player:sv.player,party:sv.party,orbs:sv.orbs,seen:sv.seen||[],caught:sv.caught||[],coins:sv.coins||0,beaten:sv.beaten||[],badges:sv.badges||[],face:'d'});enterMap(MAPS[sv.map]?sv.map:'maplewick',MAPS[sv.map]?sv.px:10,MAPS[sv.map]?sv.py:7);
    await say(`Welcome back, ${S.player}!`);goTown();return}
  S.scene='lab';S.pick=-1;
  await say('PROF. ALDER: Welcome to the world of WILDLINGS — creatures living in every meadow, river and ember-field.');
  S.player=await ask("First, what's your name?");
  await say(`${S.player}! What a fine name. Before you head out, you'll need a partner.`);
  const info={Lincendo:'a FLAME/GROUND Iberian lynx with a smouldering beard. Fast and fierce!',Platymind:'a TIDE/PSYCHIC platypus that senses thoughts through its bill. Tough!',Venibri:'a LEAF/POISON hummingbird with a venomous beak. The fastest of the three!'};
  let choice;
  while(!choice){const i=await say('Choose your first Wildling:',['Lincendo','Platymind','Venibri'].map((n,k)=>({label:n,v:k})));
    S.pick=i;const n=['Lincendo','Platymind','Venibri'][i];
    if(await say(`${n} — ${info[n]} Take it?`,[{label:'Yes',v:1},{label:'No',v:0}]))choice=n;else S.pick=-1}
  S.party=[mk(choice,5)];mark('seen',choice);mark('caught',choice);
  await say(`${S.player} received ${choice}! Here are 5 CATCH ORBS too. Weaken a wild Wildling, then throw one!`);
  await say('Explore Maplewick! Tall grass hides wild Wildlings, trainers wait on Route 1 to the north, and Brookhaven lies beyond. Talk to me in the LAB to heal.');
  S.face='d';enterMap('maplewick',10,7);goTown()}

function dmg(a,d,mv){const m=MOVES[mv];if(!m.pow)return{d:0,e:1};
  const e=TY(d.type).reduce((x,t)=>x*((EFF[m.type]||{})[t]||1),1),stab=TY(a.type).includes(m.type)?1.5:1,crit=Math.random()<.0625?1.5:1;
  const base=((2*a.lv/5+2)*m.pow*(a.atk*a.atkMod)/d.def)/50+2;
  return{d:Math.max(1,Math.floor(base*e*stab*crit*(.85+Math.random()*.15))),e,crit:crit>1}}
async function useMove(a,d,mv,mine){const who=mine?a.name:'Wild '+a.name;
  await say(`${who} used ${mv}!`);
  if(Math.random()*100>MOVES[mv].acc){await say('But it missed!');return}
  if(MOVES[mv].buff){a.def=Math.ceil(a.def*1.25);await say(`${who}'s defense rose!`);return}
  if(MOVES[mv].debuff){d.atkMod=Math.max(.5,d.atkMod*.8);await say(`${mine?'Wild '+d.name:d.name}'s attack fell!`);return}
  const r=dmg(a,d,mv);S.hit=d;S.shake=14;S.flash=3;d.hp=Math.max(0,d.hp-r.d);await wait(300);
  if(r.crit)await say('A critical hit!');if(r.e>1)await say("It's super effective!");else if(r.e<1)await say("It's not very effective...")}

async function battleLoop(tr){
  const pool=S.map==='route1'?['Pibbit','Pebblor','Mothwisp','Hootle','Hootle','Coralisk','Fumepot','Lincendo','Platymind','Venibri']:['Pibbit','Pibbit','Pebblor','Mothwisp','Hootle','Coralisk'];
  const foes=tr?tr.team.map(([n,l])=>mk(n,l)):[mk(pool[Math.floor(Math.random()*pool.length)],S.map==='route1'?4+Math.floor(Math.random()*3):3+Math.floor(Math.random()*3))];
  let fi=0;S.wild=foes[0];S.inOrb=false;S.scene='battle';
  const alive=()=>S.party.filter(m=>m.hp>0);let me=alive()[0]||S.party[0];S.party.forEach(m=>m.atkMod=1);S.lead=me;
  const foeName=w=>tr?`${tr.name}'s ${w.name}`:`Wild ${w.name}`;
  mark('seen',S.wild.name);await say(tr?`${tr.name} sent out ${S.wild.name}!`:`A wild ${S.wild.name} appeared!`);await say(`Go, ${me.name}!`);
  const swap=async(forced)=>{const opts=S.party.map((m,i)=>({label:`${m.name} <span class="t">Lv${m.lv} ${m.hp}/${m.maxhp}</span>`,v:i,disabled:m.hp<=0||m===me})).concat(forced?[]:[{label:'BACK',v:-1}]);
    const i=await say(forced?'Choose your next Wildling:':'Switch to which Wildling?',opts);if(i<0)return false;me=S.party[i];S.lead=me;await say(`Go, ${me.name}!`);return true};
  while(true){const w=S.wild;
    const act=await say(`What will ${me.name} do?`,[{label:'FIGHT',v:'f'},{label:`ORB ×${S.orbs}`,v:'o',disabled:!S.orbs||!!tr},{label:'TEAM',v:'h'},{label:'RUN',v:'r',disabled:!!tr}]);
    if(act==='r'){await say('Got away safely!');break}
    if(act==='h'){if(await swap(false))await useMove(w,me,pick(w),false);else continue}
    if(act==='f'){const mv=await say('Choose a move:',me.moves.map(m=>({label:`${m} <span class="t">${MOVES[m].type.toUpperCase()}</span>`,v:m})).concat([{label:'BACK',v:null}]));
      if(!mv)continue;
      if(me.spd>=w.spd){await useMove(me,w,mv,true);if(w.hp>0)await useMove(w,me,pick(w),false)}
      else{await useMove(w,me,pick(w),false);if(me.hp>0)await useMove(me,w,mv,true)}}
    if(act==='o'){S.orbs--;await say(`${S.player} threw a CATCH ORB!`);S.inOrb=true;
      const rate=(3*w.maxhp-2*w.hp)/(3*w.maxhp);let shakes=0;S.wobble=true;
      for(let i=0;i<3;i++){await wait(650);if(Math.random()<Math.pow(rate,.6)*0.9+.05)shakes++;else break}
      S.wobble=false;
      if(shakes===3){w.caught=true;S.party.push(w);mark('caught',w.name);await say(`Gotcha! ${w.name} was caught!`);
        await say(`${w.name} joined ${S.player}'s team. Team size: ${S.party.length}.`);break}
      S.inOrb=false;await say(['Oh no! It broke free!','Argh! Almost had it!','Shoot! So close!'][Math.min(shakes,2)]);
      await useMove(w,me,pick(w),false)}
    if(w.hp<=0){await say(`${foeName(w)} fainted!`);await say(`${me.name} gained ${w.lv*(tr?12:8)} XP.`);
      if(Math.random()<(tr?.8:.5)){me.lv++;me.maxhp+=3;me.hp=Math.min(me.maxhp,me.hp+3);me.atk++;me.def++;me.spd++;await say(`${me.name} grew to Lv ${me.lv}!`)}
      if(++fi<foes.length){S.wild=foes[fi];mark('seen',S.wild.name);await say(`${tr.name} sent out ${S.wild.name}!`);continue}
      S.wild=null;S.lead=null;return true}
    if(me.hp<=0){await say(`${me.name} fainted!`);
      if(alive().length){await swap(true);continue}
      await say(`${S.player} has no Wildlings left... and hurried back to Maplewick.`);S.party.forEach(m=>m.hp=m.maxhp);enterMap('maplewick',10,7);break}}
  S.wild=null;S.inOrb=false;S.lead=null;return false}
function pick(m){return m.moves[Math.floor(Math.random()*m.moves.length)]}
// held-direction input: continuous, no OS long-press
const press=d=>{S.hold=d;move(d)},release=d=>{if(!d||S.hold===d)S.hold=null};
dpad.querySelectorAll('button[data-d]').forEach(b=>{const d=b.dataset.d;
  b.addEventListener('touchstart',e=>{e.preventDefault();press(d)},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();release(d)},{passive:false});b.addEventListener('touchcancel',()=>release(d));
  b.addEventListener('mousedown',e=>{e.preventDefault();press(d)});b.addEventListener('mouseup',()=>release(d));b.addEventListener('mouseleave',()=>release(d))});
dpad.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY),d=el&&el.dataset&&el.dataset.d;if(d&&d!==S.hold)press(d)},{passive:false});
addEventListener('blur',()=>release());
(function holdLoop(){if(S.hold&&!S.mv&&!S.busy&&S.scene==='town')move(S.hold);requestAnimationFrame(holdLoop)})();
addEventListener('contextmenu',e=>e.preventDefault());addEventListener('selectstart',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
start();
</script>
