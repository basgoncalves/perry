<script>
const LOCS=[['🏗 Training ground – obstacle course',48.2,16.37,'course'],['Vienna – Stephansplatz',48.20849,16.37208],['Vienna – Schönbrunn',48.18451,16.31221],['Vienna – Prater',48.21662,16.39595],['Vienna – Uni Sport Centre (USZ)',48.2165,16.4113],['Lisbon – Praça do Comércio',38.70757,-9.13657],['Dubrovnik old town',42.64074,18.10886],['New York – Central Park',40.77867,-73.96907],['📍 My location',null,null]];

const toW=(lat,lon)=>{const s=Math.sin(lat*Math.PI/180);return[(lon+180)/360*256,(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256]};

// ---- obstacle course: boxes {x,z,w,d,y0,y1} and cylinders {x,z,r,y0,y1}; local metres from the H pad
const COURSE=(()=>{const box=[],cyl=[],trees=[],towers=[];
  for(let i=0;i<6;i++)cyl.push({x:i%2?4:-4,z:-20-i*12,r:.5,y0:0,y1:14,col:i%2?0xff5533:0xffffff});            // slalom poles

  box.push({x:-11,z:-100,w:14,d:1,y0:0,y1:14},{x:11,z:-100,w:14,d:1,y0:0,y1:14},{x:0,z:-100,w:8,d:1,y0:0,y1:4},{x:0,z:-100,w:8,d:1,y0:8,y1:14});

sel.onchange=go;document.getElementById('mode').onchange=go;document.getElementById('go').onclick=go;document.getElementById('mok').onclick=go;
document.getElementById('view').onclick=e=>{camMode={chase:'fpv',fpv:'top',top:'chase'}[camMode];e.target.textContent={chase:'📷 Chase',fpv:'📷 FPV',top:'📷 Top'}[camMode]};
// sticks (mode 2)

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const deadz=v=>Math.abs(v)<.08?0:v;

  if(D.alt<=0.05&&thr<=0){D.vx=D.vy=D.vz=0;D.alt=0;if(D.flying)landed();return}

  if((mission.mode==='rings'||mission.mode==='dive')&&mission.idx===mission.rings.length&&home<4)return end('Checkpoint run complete 🏁',`${D.t.toFixed(1)} s, ${D.bat.toFixed(0)}% battery left. Best: ${best(D.t)}`)}
function best(t){const k='drone-best-'+sel.value;let b=+(localStorage.getItem(k)||1e9);if(t<b){b=t;try{localStorage.setItem(k,t)}catch(e){}}return b.toFixed(1)+' s'}
function end(t,b){over=true;document.getElementById('mt').textContent=t;document.getElementById('mb').textContent=b;document.getElementById('msg').style.display='flex'}
function hideMsg(){document.getElementById('msg').style.display='none'}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function info(extra){if(!extra&&mission.course)extra=mission.mode==='dive'?'Rooftop dive: build speed, pull up through the loop rings, then drop straight down into the open-top tower, out of its door and land on the H.':mission.mode==='rings'?'Course: slalom → window → tunnel → under the bar → between the towers → over the trees, then land on the H. Touch anything and you crash.':mission.mode==='land'?'Course: thread through the obstacles and land on the orange pad behind the low bar.':'Training ground: slalom poles, a wall window, a tunnel, a low bar, towers and trees. Practise freely — touching anything is a crash.';const mi=document.getElementById('mini');mi.style.opacity=1;clearTimeout(info.t);info.t=setTimeout(()=>mi.style.opacity=0,7000);const m=mission.mode;document.getElementById('mini').textContent=extra||(m==='free'?'Free flight. Push the left stick up to take off. Max 120 m (EU limit).':m==='rings'?'Fly through the 6 numbered rings in order at the right height, then land back on the H.':'Fly to the orange target and land within 3 m of its centre.')}
// ---------- 3D render ----------

function texFor(z,x,y){const k=z+'/'+x+'/'+y;if(loader[k])return loader[k];const t=new T.TextureLoader();t.setCrossOrigin('anonymous');

// metres relative to origin: east = +x, north = -z
function wm(x,y){return[(x-org.x)*org.u,(y-org.y)*org.u]}
function makeGround(z,n,yoff){const g=new T.Group();g.userData={z,n,cx:null,cy:null,yoff};scene.add(g);return g}
function updGround(g){const{z,n}=g.userData,N=2**z;const cx=Math.floor(D.x*N/256),cy=Math.floor(D.y*N/256);

    const p=new T.Mesh(new T.CylinderGeometry(.11,.11,.005,16),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35}));p.position.set(sx*.23,.05,sz*.23);g.add(p);props.push(p);

function mission3d(){ringMeshes.forEach(m=>scene.remove(m));padMeshes.forEach(m=>scene.remove(m));ringMeshes=[];padMeshes=[];

    const wall=new T.MeshStandardMaterial({color:0xc9b79c}),tow=[0x8fa3b8,0xa7b0bd,0x7d8ea3,0xb9a58c],trunk=new T.MeshStandardMaterial({color:0x6b4a2b}),leaf=new T.MeshStandardMaterial({color:0x2f7d32}),tun=new T.MeshStandardMaterial({color:0x777777});
