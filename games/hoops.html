  const p={id:S.nid++,name:pick(FIRST)+' '+pick(LAST),pos,age,r,tid:-1,inj:0,st:blank(),ps:blank()};p.ovr=ovr(p);p.pot=clamp(p.ovr+(age<27?RI(0,(27-age)*3):0),p.ovr,97);S.P[p.id]=p;return p}
function aiTactics(t){const top=t.order.slice(0,8).map(P),av=k=>top.reduce((s,p)=>s+p.r[k],0)/top.length;
  t.tac={pace:RI(0,2),focus:av('tp')>av('ins')+2?2:av('ins')>av('tp')+7?0:1,def:Math.random()<.6?0:Math.random()<.6?1:2}}
const sortRoster=t=>t.order.sort((a,b)=>P(b).ovr-P(a).ovr);
function strength(t){const o=t.order.map(P).sort((a,b)=>b.ovr-a.ovr).slice(0,8);return o.reduce((s,p)=>s+p.ovr,0)/o.length}
function mkReal(d,tid){const r={};KEYS.forEach((k,i)=>r[k]=d[3+i]);const p={id:S.nid++,name:d[0],pos:d[1],age:d[2],r,tid,inj:0,st:blank(),ps:blank()};p.ovr=ovr(p);p.pot=clamp(p.ovr+(p.age<26?RI(26-p.age,(26-p.age)*3):0),p.ovr,97);S.P[p.id]=p;return p}
function newLeague(){S={v:2,nid:1,season:2026,day:0,phase:'pick',user:-1,P:{},teams:[],fa:[],sched:[],res:{},po:null,hist:[],last:null,draft:null};
  REAL.teams.forEach((rt,i)=>{const t={id:i,w:0,l:0,pf:0,pa:0,order:[],tac:{pace:1,focus:1,def:0}};rt[5].forEach(d=>t.order.push(mkReal(d,i).id));S.teams.push(t);sortRoster(t);aiTactics(t)});
  REAL.fa.forEach(d=>S.fa.push(mkReal(d,-1).id))}
function genSchedule(){let arr=shuffle([...Array(30).keys()]);const rounds=[];
  for(let r=0;r<29;r++){const d=[];for(let i=0;i<15;i++){const a=arr[i],b=arr[29-i];d.push(r%2?[a,b]:[b,a])}rounds.push(d);arr=[arr[0],arr[29],...arr.slice(1,29)]}
  const flip=d=>d.map(([a,b])=>[b,a]);const days=[...rounds,...rounds.map(flip),...shuffle(rounds.slice()).slice(0,24).map((d,i)=>i%2?flip(d):d)];S.sched=shuffle(days)}
// ---------- match engine ----------
function wp(list,f){let tot=0;const w=list.map(x=>{const v=f(x);tot+=v;return v});let r=Math.random()*tot;for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}return list[list.length-1]}
function projMin(t){const MINS=ROT[t.rot||0],act=t.order.map(P).filter(p=>!p.inj).slice(0,11),m={};const tot=MINS.slice(0,act.length).reduce((a,b)=>a+b,0)||1;act.forEach((p,i)=>m[p.id]=Math.round(MINS[i]*240/tot));return m}
function prep(t,box){const m=projMin(t),pl=t.order.map(P).filter(p=>m[p.id]).map(p=>({p,min:m[p.id],b:box[p.id]||(box[p.id]={...blank(),id:p.id}),use:m[p.id]*Math.pow((p.r.ins*.4+p.r.mid*.25+p.r.tp*.35)/60,1.7)}));
  const av=(f,wf=()=>1)=>{let s=0,w=0;pl.forEach(x=>{const k=x.min*wf(x.p);s+=f(x.p)*k;w+=k});return s/w};const big=p=>p.pos=='C'||p.pos=='PF';
  return{t,tac:t.tac,fat:t.rot==1?.006:0,pl,def:av(p=>p.r.def),reb:av(p=>p.r.reb),pas:av(p=>p.r.pas),defI:av(p=>p.r.def*.8+p.r.ath*.2,p=>big(p)?1.6:.6),defP:av(p=>p.r.def*.7+p.r.ath*.3,p=>big(p)?.6:1.4)}}
function poss(O,X,home){let pts=0;
  const toP=.125+(X.tac.def==2?.025:0)+(O.tac.pace==2?.008:0)-(O.pas-60)*.0007+(X.def-60)*.0006;
  if(Math.random()<toP){wp(O.pl,x=>x.use).b.to++;if(Math.random()<.55)wp(X.pl,x=>x.min*x.p.r.def*x.p.r.ath).b.stl++;return 0}
  for(let k=0;k<4;k++){const s=wp(O.pl,x=>x.use),r=s.p.r,zone=X.tac.def==1,press=X.tac.def==2;
    const p3=clamp(.1+(r.tp-45)*.011,.02,.6)*[.72,1,1.3][O.tac.focus];
    const type=Math.random()<p3?2:Math.random()<r.ins/(r.ins+r.mid*.7)*[1.15,1,.95][O.tac.focus]?0:1;
    let pct=type==2?.33+(r.tp-60)*.0035-(X.defP-60)*.0025+(zone?.015:0):type==1?.405+(r.mid-60)*.0035-(X.def-60)*.0025:.575+(r.ins-60)*.004-(X.defI-60)*.003-(zone?.02:0);
    pct+=(press?.012:0)+(home?.008:0)-O.fat;
    if(Math.random()<[.18,.06,.03][type]+(press?.015:0)){const fp=clamp(.62+((r.mid+r.tp)/2-50)*.005,.4,.93);let lastIn=0;
      for(let i=0;i<(type==2?3:2);i++){s.b.fta++;lastIn=Math.random()<fp;if(lastIn){s.b.ftm++;s.b.pts++;pts++}}
      if(!lastIn)wp(X.pl,x=>x.min*x.p.r.reb**1.5).b.reb++;return pts}
    s.b.fga++;if(type==2)s.b.tpa++;
    if(Math.random()<pct){const v=type==2?3:2;s.b.fgm++;if(type==2)s.b.tpm++;s.b.pts+=v;pts+=v;
      if(Math.random()<(type==2?.8:.52)*(.75+O.pas/240))wp(O.pl,x=>x===s?0:x.min*x.p.r.pas**4).b.ast++;return pts}
    if(type==0&&Math.random()<.14)wp(X.pl,x=>x.min*x.p.r.def*(x.p.pos=='C'?3:x.p.pos=='PF'?2:.6)).b.blk++;
    if(Math.random()<clamp(.26+(O.reb-X.reb)*.005,.12,.4)){wp(O.pl,x=>x.min*x.p.r.reb**1.5).b.reb++;continue}
    wp(X.pl,x=>x.min*x.p.r.reb**1.5).b.reb++;return pts}
  return pts}
function startGame(h,a,po){return{h,a,po,q:[[],[]],hs:0,as:0,per:0,box:[{},{}],rnd:R(-3,3),done:false}}
function playPeriod(G){const ot=G.per>=4,H=prep(T(G.h),G.box[0]),A=prep(T(G.a),G.box[1]);const n=Math.round((101+(H.tac.pace-1)*3+(A.tac.pace-1)*3+G.rnd)/4),len=ot?Math.round(n*5/12):n;
  [H,A].forEach(X=>X.pl.forEach(x=>x.b.min+=x.min*(ot?5/48:.25)));let x=0,y=0;for(let i=0;i<len;i++){x+=poss(H,A,true);y+=poss(A,H,false)}
  G.q[0].push(x);G.q[1].push(y);G.hs+=x;G.as+=y;G.per++;G.done=G.per>=4&&G.hs!=G.as}
function finishGame(G){const{h,a,po,hs,as}=G,key=po?'ps':'st';const rows=G.box.map(o=>Object.values(o).sort((x,y)=>y.min-x.min));
  rows.forEach((r,i)=>{const risk=T(i?a:h).rot==1?.008:.004;r.forEach(b=>{const p=P(b.id);b.min=Math.round(b.min);const st=p[key];st.g++;for(const k in st)if(k!='g')st[k]+=b[k];if(Math.random()<risk)p.inj=RI(1,14)})});
  if(!po){const th=T(h),ta=T(a);th.pf+=hs;th.pa+=as;ta.pf+=as;ta.pa+=hs;hs>as?(th.w++,ta.l++):(ta.w++,th.l++)}
  const g={h,a,hs,as,q:G.q,win:hs>as?h:a,lose:hs>as?a:h};if(h==S.user||a==S.user)S.last={...g,box:rows,po};return g}
function simGame(h,a,po){if(PRE&&PRE.h==h&&PRE.a==a){const g=PRE;PRE=null;return g}const G=startGame(h,a,po);while(!G.done)playPeriod(G);return finishGame(G)}
function nextPOGame(){const po=S.po,u=S.user;if(!po||po.champ!=null)return null;const s=po.seeds[TEAMS[u][3]];
  if(po.stage=='pi1')return[s[6],s[7]].includes(u)?[s[6],s[7]]:[s[8],s[9]].includes(u)?[s[8],s[9]]:null;
  if(po.stage=='pi2'){const[g1,g2]=po.pi[TEAMS[u][3]];return u==g1.lose||u==g2.win?[g1.lose,g2.win]:null}
  const x=po.rounds[po.rounds.length-1].find(x=>(x.a==u||x.b==u)&&x.wa<4&&x.wb<4);if(!x)return null;return[0,1,4,6].includes(x.wa+x.wb)?[x.a,x.b]:[x.b,x.a]}
function heal(){for(const id in S.P)if(S.P[id].inj>0)S.P[id].inj--;S.teams.forEach(t=>{if(t.id!=S.user)sortRoster(t)})}
function playDay(){if(S.phase!='regular')return;S.sched[S.day].forEach(([h,a])=>{const g=simGame(h,a,false);if(h==S.user||a==S.user)S.res[S.day]=[g.hs,g.as]});S.day++;heal();if(S.day>=82)startPlayoffs()}
// ---------- standings & playoffs ----------
const pct=t=>t.w+t.l?t.w/(t.w+t.l):0;
function standings(c){return S.teams.filter(t=>TEAMS[t.id][3]==c).sort((a,b)=>pct(b)-pct(a)||(b.pf-b.pa)-(a.pf-a.pa))}
const better=(a,b)=>{const x=T(a),y=T(b);return pct(x)>pct(y)||(pct(x)==pct(y)&&x.pf-x.pa>=y.pf-y.pa)};
function startPlayoffs(){S.phase='playoffs';S.po={seeds:[0,1].map(c=>standings(c).slice(0,10).map(t=>t.id)),stage:'pi1',pi:[[],[]],rounds:[],champ:null}}
function playPO(){const po=S.po;if(!po||po.champ!=null)return;
  if(po.stage=='pi1'){[0,1].forEach(c=>{const s=po.seeds[c];po.pi[c]=[simGame(s[6],s[7],true),simGame(s[8],s[9],true)]});po.stage='pi2'}
  else if(po.stage=='pi2'){const r1=[];[0,1].forEach(c=>{const s=po.seeds[c],[g1,g2]=po.pi[c],g3=simGame(g1.lose,g2.win,true);po.pi[c].push(g3);
      const f=[...s.slice(0,6),g1.win,g3.win];[[0,7],[3,4],[2,5],[1,6]].forEach(([x,y])=>r1.push({a:f[x],b:f[y],wa:0,wb:0}))});po.rounds.push(r1);po.stage='r'}
  else{const cur=po.rounds[po.rounds.length-1];cur.forEach(s=>{if(s.wa==4||s.wb==4)return;const n=s.wa+s.wb,home=[0,1,4,6].includes(n);const g=home?simGame(s.a,s.b,true):simGame(s.b,s.a,true);g.win==s.a?s.wa++:s.wb++});
    if(cur.every(s=>s.wa==4||s.wb==4)){const w=cur.map(s=>s.wa==4?s.a:s.b);if(w.length==1){po.champ=w[0];S.phase='offseason'}
      else{const nx=[];for(let i=0;i<w.length;i+=2){const hi=better(w[i],w[i+1]);nx.push({a:hi?w[i]:w[i+1],b:hi?w[i+1]:w[i],wa:0,wb:0})}po.rounds.push(nx)}}}
  heal()}
function userResult(){const po=S.po,u=S.user,c=TEAMS[u][3];if(!po.seeds[c].includes(u))return'Missed the playoffs';
  if(!po.rounds[0]||!po.rounds[0].some(s=>s.a==u||s.b==u))return'Lost in the play-in';const names=['first round','conference semi-finals','conference finals','Finals'];
  for(let i=0;i<po.rounds.length;i++){const s=po.rounds[i].find(s=>s.a==u||s.b==u);if(!s)break;const won=(s.a==u&&s.wa==4)||(s.b==u&&s.wb==4);if(!won)return'Lost in the '+names[i]}
  return po.champ==u?'CHAMPIONS 🏆':'Playoffs'}
const userAlive=()=>{const po=S.po,u=S.user;if(!po||po.champ!=null)return false;const sd=po.seeds[TEAMS[u][3]];if(po.stage=='pi1')return sd.includes(u);
  if(po.stage=='pi2'){const[g1,g2]=po.pi[TEAMS[u][3]];return sd.slice(0,6).includes(u)||g1.win==u||g1.lose==u||g2.win==u}
  return po.rounds[po.rounds.length-1].some(s=>(s.a==u&&s.wb<4)||(s.b==u&&s.wa<4))};
// ---------- off-season ----------
function expectation(){const rk=S.teams.slice().sort((a,b)=>strength(b)-strength(a)).findIndex(t=>t.id==S.user)+1;S.exp=rk<=6?'Win a playoff series':rk<=16?'Make the playoffs':'Develop the squad and win 25+ games'}
function expMet(res){const t=T(S.user);if(S.exp[0]=='W')return/semi|conference finals|Finals|CHAMP/.test(res);if(S.exp[0]=='M')return!/Missed|play-in/.test(res);return t.w>=25}
function offseason(){const res=userResult(),t=T(S.user);S.hist.push({s:S.season,w:t.w,l:t.l,res,champ:tn(S.po.champ),met:expMet(res),exp:S.exp});
  const order=S.teams.slice().sort((a,b)=>pct(a)-pct(b)).map(t=>t.id);
  for(const id in S.P){const p=S.P[id],a=p.age,d=()=>a<=22?RI(0,5):a<=25?RI(-1,4):a<=29?RI(-2,2):a<=32?RI(-3,1):RI(-5,0);const base=d();
    for(const k of KEYS)p.r[k]=clamp(p.r[k]+base+RI(-1,1)-(k=='ath'&&a>30?1:0),20,99);p.age++;p.ovr=ovr(p);p.pot=Math.max(p.ovr,a>=27?p.ovr:p.pot);p.inj=0;
    if(p.age>=38||(p.age>=34&&Math.random()<.3)||(p.tid<0&&(p.ovr<48||p.age>32)))remove(p)}
  const pool=[];for(let i=0;i<60;i++){const p=mkPlayer(pick(POS),R(40,60)+(i<8?8:0),RI(19,22));p.pot=clamp(p.ovr+RI(4,26),p.ovr,96);p.tid=-2;pool.push(p.id)}
  S.draft={order:[...order,...order],pick:0,pool,log:[]};S.phase='draft';runDraft()}
function remove(p){if(p.tid>=0){const t=T(p.tid);t.order=t.order.filter(i=>i!=p.id)}S.fa=S.fa.filter(i=>i!=p.id);delete S.P[p.id]}
const dval=p=>p.ovr*.55+p.pot*.45;
function draftPick(pid){const d=S.draft,tid=d.order[d.pick],p=P(pid);d.pool=d.pool.filter(i=>i!=pid);p.tid=tid;T(tid).order.push(pid);d.log.push(`#${d.pick+1} ${ab(tid)} — ${p.name} (${p.pos}, ${p.ovr}/${p.pot})`);d.pick++}
function runDraft(auto){const d=S.draft;while(d.pick<60&&(auto||d.order[d.pick]!=S.user))draftPick(d.pool.slice().sort((a,b)=>dval(P(b))-dval(P(a)))[0]);if(d.pick>=60)endDraft()}
function endDraft(){S.draft.pool.forEach(i=>{P(i).tid=-1;S.fa.push(i)});S.draft.pool=[];

    while(t.order.length<13&&S.fa.length){const id=S.fa.slice().sort((a,b)=>P(b).ovr-P(a).ovr)[0];sign(id,t.id)}sortRoster(t);aiTactics(t)});

  else if(S.phase=='offseason'){const res=userResult();h+=`<div class="card"><div class="big">${res}</div><p>Final record ${rec(t)}. Champions: <b>${tn(S.po.champ)}</b>.</p><p>Owner wanted: ${S.exp} — <b class="${expMet(res)?'w':'lo'}">${expMet(res)?'target met':'target missed'}</b></p><button class="btn" data-a="off">Go to the off-season & draft</button></div>`+bracketHTML()}
  else if(S.phase=='draft'){const d=S.draft;h+=`<div class="card"><h3 style="margin-top:0">Rookie draft — pick #${d.pick+1}: you're on the clock</h3><button class="btn g" data-a="autodraft">Auto-draft the rest</button>
    <div class="sc"><table><tr><th>Prospect</th><th>Pos</th><th>Age</th><th>OVR</th><th>POT</th><th></th></tr>`+d.pool.slice().sort((a,b)=>dval(P(b))-dval(P(a))).slice(0,25).map(i=>{const p=P(i);return`<tr><td>${p.name}</td><td>${p.pos}</td><td>${p.age}</td><td>${p.ovr}</td><td>${p.pot}</td><td><button class="btn s" data-a="draft" data-v="${i}">Draft</button></td></tr>`}).join('')+
    `</table></div><div class="mut">${d.log.slice(-6).join('<br>')}</div></div>`}
  else if(S.phase=='pre'){const n=t.order.length;h+=`<div class="card"><p>Draft done. Players have aged and developed — check your roster, the free agents and the trade market.</p><p>Roster: <b>${n}</b> players ${n>15?'<span class="lo">— release '+(n-15)+' to get down to 15</span>':n<10?'<span class="lo">— sign players to reach at least 10</span>':''}</p>
    <div class="mut">${S.draft.log.filter(l=>l.includes(' '+ab(S.user)+' ')).join('<br>')}</div><button class="btn" data-a="season" ${n>15||n<10?'disabled':''}>Start the ${S.season}–${String(S.season+1).slice(2)} season</button></div>`}
  return h};
function tacHTML(){const t=T(S.user),opt=(k,arr,cur)=>`<select data-c="tac" data-k="${k}">${arr.map((n,i)=>`<option value="${i}" ${cur==i?'selected':''}>${n}</option>`).join('')}</select>`;
  return`<div class="row"><label>Pace ${opt('pace',PACE,t.tac.pace)}</label><label>Offence ${opt('focus',FOC,t.tac.focus)}</label><label>Defence ${opt('def',DEFN,t.tac.def)}</label><label>Minutes ${opt('rot',ROTN,t.rot||0)}</label></div>`}
function liveHTML(){const G=UI.live,u=S.user,me=G.h==u?0:1,opp=T(me?G.h:G.a),qs=i=>G.q[i].map(x=>`<td>${x}</td>`).join(''),us=me?G.as:G.hs,th=me?G.hs:G.as;
  const nxt=G.per<4?'Q'+(G.per+1):'overtime',rows=o=>Object.values(o).sort((a,b)=>b.pts-a.pts);
  const tb=(o,n)=>`<h3>${n}</h3><div class="sc"><table><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>FG</th><th>3P</th><th>TO</th></tr>`+rows(o).map(b=>{const p=P(b.id);return`<tr><td>${p.name} <span class="mut">${p.pos}</span></td><td>${Math.round(b.min)}</td><td><b>${b.pts}</b></td><td>${b.reb}</td><td>${b.ast}</td><td>${b.fgm}-${b.fga}</td><td>${b.tpm}-${b.tpa}</td><td>${b.to}</td></tr>`}).join('')+'</table></div>';
  return`<div class="card"><div class="mut">LIVE${G.po?' · playoffs':''} · ${G.per?'end of '+(G.per<=4?'Q'+G.per:'OT'):'tip-off'}</div><div class="big ${us>th?'w':us<th?'lo':''}">${ab(G.h)} ${G.hs} – ${G.as} ${ab(G.a)}</div>
  ${G.per?`<div class="sc"><table><tr><th></th>${G.q[0].map((_,i)=>`<th>${i<4?'Q'+(i+1):'OT'}</th>`).join('')}</tr><tr><td>${ab(G.h)}</td>${qs(0)}</tr><tr><td>${ab(G.a)}</td>${qs(1)}</tr></table></div>`:''}
  <h3>Your game plan for ${nxt}</h3>${tacHTML()}<div class="mut">To change who plays, reorder the depth chart in the Roster tab — it applies from the next period.</div>
  <p class="mut">${tn(opp.id)} are playing: ${PACE[opp.tac.pace].toLowerCase()} pace · ${FOC[opp.tac.focus].toLowerCase()} · ${DEFN[opp.tac.def].toLowerCase()}</p>
  <button class="btn" data-a="period">Play ${nxt}</button><button class="btn g" data-a="finish">Sim to the final whistle</button><button class="btn g" data-a="relive">↺ Restart game</button></div>`+(G.per?`<div class="card">${tb(G.box[me],tn(u))}${tb(G.box[1-me],tn(opp.id))}</div>`:'')}
V.roster=()=>{const t=T(S.user),m=projMin(t);
  return`<h2>Roster & tactics</h2><div class="card">${tacHTML()}
  <div class="mut">Zone protects the rim but gives up threes. The press forces turnovers but concedes fouls and easier shots. Fast pace means more possessions and a few more turnovers. Riding the starters gives them more minutes but tires them (slightly worse shooting, double the injury risk).</div></div>
  <div class="card"><div class="row"><b>Depth chart</b><button class="btn s" data-a="auto">Sort by rating</button><span class="mut">Order sets minutes: top 5 start, 11 play. ${t.order.length}/15</span></div>
  <div class="sc"><table><tr><th>#</th><th class="l">Player</th><th>Pos</th><th>Age</th><th>OVR</th><th>POT</th><th>MIN</th><th>INS</th><th>MID</th><th>3PT</th><th>PAS</th><th>REB</th><th>DEF</th><th>ATH</th><th></th></tr>`+
  t.order.map((id,i)=>{const p=P(id);return`<tr class="${i==4?'cut':''}"><td>${i+1}</td><td class="l">${p.name}${p.inj?` <span class="inj">✚${p.inj}g</span>`:''}</td><td>${p.pos}</td><td>${p.age}</td><td><b>${p.ovr}</b></td><td>${p.pot}</td><td>${m[id]||0}</td>${KEYS.map(k=>`<td>${p.r[k]}</td>`).join('')}<td><button class="btn s" data-a="up" data-v="${i}">▲</button><button class="btn s" data-a="down" data-v="${i}">▼</button><button class="btn s" data-a="release" data-v="${id}">✕</button></td></tr>`}).join('')+'</table></div></div>'};
V.table=()=>'<h2>Standings</h2>'+[0,1].map(c=>{const st=standings(c),top=st[0];return`<div class="card"><h3 style="margin-top:0">${c?'Western':'Eastern'} Conference</h3><div class="sc"><table><tr><th>#</th><th class="l">Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th><th>PF</th><th>PA</th></tr>`+
  st.map((t,i)=>{const g=t.w+t.l||1;return`<tr class="${t.id==S.user?'me':''} ${i==5||i==9?'cut':''}"><td>${i+1}</td><td class="l">${tn(t.id)}</td><td>${t.w}</td><td>${t.l}</td><td>${pct(t).toFixed(3).slice(1)}</td><td>${f1(((top.w-t.w)+(t.l-top.l))/2)}</td><td>${f1(t.pf/g)}</td><td>${f1(t.pa/g)}</td></tr>`}).join('')+'</table></div><div class="mut">Top 6 qualify; seeds 7–10 go to the play-in.</div></div>'}).join('');
V.games=()=>'<h2>Schedule</h2><div class="card"><div class="sc"><table><tr><th>#</th><th class="l">Opponent</th><th>Result</th></tr>'+S.sched.map((d,i)=>{const g=d.find(g=>g.includes(S.user)),home=g[0]==S.user,r=S.res[i];let res='';
  if(r){const us=home?r[0]:r[1],th=home?r[1]:r[0];res=`<span class="${us>th?'w':'lo'}">${us>th?'W':'L'} ${us}–${th}</span>`}return`<tr><td>${i+1}</td><td class="l">${home?'vs':'@'} ${tn(home?g[1]:g[0])}</td><td>${res}</td></tr>`}).join('')+'</table></div></div>';
V.stats=()=>{const key=S.phase=='playoffs'||S.phase=='offseason'?'ps':'st',all=Object.values(S.P).filter(p=>p.tid>=0&&p.st.g>=Math.max(1,S.day*.5));
  const lead=(n,f)=>`<div class="card"><h3 style="margin-top:0">${n}</h3>`+all.slice().sort((a,b)=>f(b)-f(a)).slice(0,8).map((p,i)=>`<div class="${p.tid==S.user?'w':''}">${i+1}. ${p.name} <span class="mut">${ab(p.tid)}</span> <b style="float:right">${f1(f(p))}</b></div>`).join('')+'</div>';
  const t=T(S.user);return`<h2>Stats</h2><div class="card"><h3 style="margin-top:0">${tn(S.user)} — ${key=='ps'?'playoffs':'regular season'} per game</h3><div class="sc"><table><tr><th>Player</th><th>G</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>FG%</th><th>3P%</th><th>FT%</th></tr>`+
  t.order.map(P).map(p=>{const s=p[key],g=s.g||1,pc=(a,b)=>b?f1(100*a/b):'–';return`<tr><td>${p.name}</td><td>${s.g}</td><td>${f1(s.min/g)}</td><td><b>${f1(s.pts/g)}</b></td><td>${f1(s.reb/g)}</td><td>${f1(s.ast/g)}</td><td>${f1(s.stl/g)}</td><td>${f1(s.blk/g)}</td><td>${pc(s.fgm,s.fga)}</td><td>${pc(s.tpm,s.tpa)}</td><td>${pc(s.ftm,s.fta)}</td></tr>`}).join('')+
  `</table></div></div><h3>League leaders (regular season)</h3>`+lead('Points per game',p=>p.st.pts/p.st.g)+lead('Rebounds per game',p=>p.st.reb/p.st.g)+lead('Assists per game',p=>p.st.ast/p.st.g)};
V.market=()=>{if(UI.live)return'<h2>Market</h2><div class="card">No deals during a game.</div>';if(S.phase=='playoffs'||S.phase=='offseason'||S.phase=='draft')return'<h2>Market</h2><div class="card">The market is closed until the draft is over.</div>';if(UI.tt==S.user)UI.tt=(S.user+1)%30;
  const row=(p,side)=>`<tr><td><label><input type="checkbox" data-c="tr" data-k="${side}" data-v="${p.id}" ${UI[side][p.id]?'checked':''}> ${p.name}</label></td><td>${p.pos}</td><td>${p.age}</td><td><b>${p.ovr}</b></td><td>${p.pot}</td></tr>`,hd='<tr><th>Player</th><th>Pos</th><th>Age</th><th>OVR</th><th>POT</th></tr>';
  return`<h2>Market</h2><div class="card"><h3 style="margin-top:0">Trade</h3>${UI.msg?`<p><b>${UI.msg}</b></p>`:''}<select data-c="tt">${S.teams.filter(t=>t.id!=S.user).map(t=>`<option value="${t.id}" ${t.id==UI.tt?'selected':''}>${tn(t.id)} (${rec(t)})</option>`).join('')}</select>
  <h3>You give</h3><div class="sc"><table>${hd}${T(S.user).order.map(i=>row(P(i),'give')).join('')}</table></div><h3>You get</h3><div class="sc"><table>${hd}${T(UI.tt).order.map(i=>row(P(i),'get')).join('')}</table></div><button class="btn" data-a="trade">Propose trade</button></div>
  <div class="card"><h3 style="margin-top:0">Free agents</h3><div class="sc"><table><tr><th>Player</th><th>Pos</th><th>Age</th><th>OVR</th><th>POT</th><th></th></tr>`+S.fa.map(P).sort((a,b)=>b.ovr-a.ovr).map(p=>`<tr><td>${p.name}</td><td>${p.pos}</td><td>${p.age}</td><td><b>${p.ovr}</b></td><td>${p.pot}</td><td><button class="btn s" data-a="sign" data-v="${p.id}">Sign</button></td></tr>`).join('')+'</table></div></div>'};
V.history=()=>'<h2>History <button class="btn s" data-a="nav" data-v="menu">☰ Menu</button></h2><div class="card">'+(S.hist.length?S.hist.slice().reverse().map(h=>`<p><b>${h.s-1}–${String(h.s).slice(2)}</b>: ${h.w}–${h.l}, ${h.res}. <span class="${h.met?'w':'lo'}">${h.met?'Target met':'Target missed'}</span> <span class="mut">(${h.exp}). Champions: ${h.champ}</span></p>`).join(''):'No finished seasons yet.')+'</div>';
V.menu=()=>{const has=S.user>=0,t=has&&T(S.user);return`<div style="text-align:center;padding:26px 0 10px"><div style="font-size:54px">🏀</div><h2 style="font-size:26px">Hoops Manager</h2><div class="mut">v${VERSION}</div></div>
  <div class="card" style="text-align:center">${has?`<p><b>${tn(S.user)}</b><br><span class="mut">${S.season-1}–${String(S.season).slice(2)} season · ${rec(t)} · ${S.hist.length} season${S.hist.length==1?'':'s'} completed</span></p><button class="btn" style="width:100%" data-a="nav" data-v="home">▶ Continue career</button>`:''}
  <button class="btn ${has?'g':''}" style="width:100%" data-a="reset">${has?'↺ Restart — new career':'▶ New career'}</button>${has?'<button class="btn g" style="width:100%" data-a="nav" data-v="history">📜 Career history</button>':''}</div>
  <div class="card"><h3 style="margin-top:0">How to play</h3><div class="mut">Pick one of the 30 NBA teams. Set your depth chart and tactics in <b>Roster</b>. On <b>Home</b>, coach each game live quarter by quarter — changing your game plan between periods — or quick-sim. After 82 games come the play-in and playoffs, then the draft. Use <b>Market</b> for trades and free agents. Progress saves automatically.</div></div>`};
const NAV=[['home','🏠','Home'],['roster','👥','Roster'],['table','🏆','Table'],['games','📅','Games'],['stats','📊','Stats'],['market','🔁','Market'],['menu','☰','Menu']];
function render(){const mn=UI.view=='menu',pk=S.phase=='pick'&&!mn;document.getElementById('app').innerHTML=pk?V.pick():V[UI.view]();document.getElementById('nav').innerHTML=pk||mn?'':NAV.map(([v,i,n])=>`<button class="${UI.view==v?'on':''}" data-a="nav" data-v="${v}"><b>${i}</b>${n}</button>`).join('')}
function endLive(){PRE=finishGame(UI.live);UI.live=null;S.phase=='regular'?playDay():playPO()}
const A={nav(v){UI.view=v;UI.msg='';window.scrollTo(0,0)},choose(v){S.user=+v;startSeason(true);UI.view='home'},
  live(){let m;if(S.phase=='regular'){const n=nextGame();m=n.home?[S.user,n.opp]:[n.opp,S.user]}else m=nextPOGame();if(m)UI.live=startGame(m[0],m[1],S.phase!='regular')},
  period(){const G=UI.live;playPeriod(G);if(G.done)endLive()},finish(){const G=UI.live;while(!G.done)playPeriod(G);endLive()},
  play(v){if(UI.live)return;for(let i=0;i<+v&&S.phase=='regular';i++)playDay()},po(v){if(UI.live)return;for(let i=0;i<+v&&S.phase=='playoffs';i++)playPO()},
  off(){offseason()},draft(v){draftPick(+v);runDraft()},autodraft(){runDraft(true)},season(){startSeason(false)},auto(){sortRoster(T(S.user))},
  up(v){const o=T(S.user).order,i=+v;if(i>0)[o[i-1],o[i]]=[o[i],o[i-1]]},down(v){const o=T(S.user).order,i=+v;if(i<o.length-1)[o[i+1],o[i]]=[o[i],o[i+1]]},
  release(v){if(T(S.user).order.length>8&&confirm('Release '+P(+v).name+'?'))release(+v)},
  sign(v){if(T(S.user).order.length>=15)alert('Roster is full (15). Release someone first.');else sign(+v,S.user)},
  trade(){const g=Object.keys(UI.give).filter(k=>UI.give[k]).map(Number),r=Object.keys(UI.get).filter(k=>UI.get[k]).map(Number),me=T(S.user),th=T(UI.tt);
    if(!g.length||!r.length){UI.msg='Tick at least one player on each side.';return}const mine=me.order.length-g.length+r.length,theirs=th.order.length-r.length+g.length;
    if(mine>15||theirs>15||mine<10||theirs<10){UI.msg='Rosters must stay between 10 and 15 players.';return}
    const vg=g.reduce((s,i)=>s+val(P(i)),0),vr=r.reduce((s,i)=>s+val(P(i)),0);if(vg<vr*1.05){UI.msg=`${tn(UI.tt)} say no — they want more in return.`;return}
    g.forEach(i=>{me.order=me.order.filter(x=>x!=i);th.order.push(i);P(i).tid=th.id});r.forEach(i=>{th.order=th.order.filter(x=>x!=i);me.order.push(i);P(i).tid=me.id});sortRoster(th);aiTactics(th);UI.give={};UI.get={};UI.msg='Trade accepted! New players are at the bottom of your depth chart.'},
  reset(){if(S.user<0||confirm('Delete this career and start a new one?')){newLeague();UI.live=null;UI.view='home'}},
  relive(){const G=UI.live;if(confirm('Restart this game from tip-off?'))UI.live=startGame(G.h,G.a,G.po)}};
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;A[b.dataset.a](b.dataset.v);save();render()});
document.body.addEventListener('change',e=>{const el=e.target,c=el.dataset.c;if(!c)return;if(c=='tac'){if(el.dataset.k=='rot')T(S.user).rot=+el.value;else T(S.user).tac[el.dataset.k]=+el.value}if(c=='tt'){UI.tt=+el.value;UI.give={};UI.get={};UI.msg=''}if(c=='tr'){UI[el.dataset.k][el.dataset.v]=el.checked;return}save();render()});
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||S.v!=2)newLeague();render();
</script></body></html>
